<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="sidebar(active)">

<button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Меню">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="sidebar" id="appSidebar">

    <div class="brand"><span class="dot"></span> ADMIN // ROOT</div>

    <ul class="nav">
        <li><a th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'active'">📊 Табло</a></li>
        <li><a th:href="@{/companies}" th:classappend="${active == 'companies'} ? 'active'">🏢 Фирми</a></li>
        <li><a th:href="@{/users}" th:classappend="${active == 'users'} ? 'active'">👤 Потребители</a></li>
        <li><a th:href="@{/vehicles}" th:classappend="${active == 'vehicles'} ? 'active'">🚛 МПС</a></li>
        <li><a th:href="@{/trips}" th:classappend="${active == 'trips'} ? 'active'">📦 Курсове</a></li>
        <li><a th:href="@{/drivers}" th:classappend="${active == 'drivers'} ? 'active'">👨‍✈️ Шофьори</a></li>
        <li><a th:href="@{/audit-log}" th:classappend="${active == 'audit-log'} ? 'active'">📜 Одит лог</a></li>
        <li><a th:href="@{/backup}">💾 Свали бекъп</a></li>
    </ul>

    <form th:action="@{/logout}" method="post" style="margin-top:auto;">
        <button type="submit" class="link-btn"
                style="color:var(--accent); font-size:13px; padding:9px 10px; background:none; border:none; cursor:pointer; width:100%; text-align:left;">
            ⏻ Изход
        </button>
    </form>

</div>

<script>
    (function () {
        var toggle = document.getElementById('sidebarToggle');
        var sidebar = document.getElementById('appSidebar');
        var overlay = document.getElementById('sidebarOverlay');
        if (!toggle || !sidebar || !overlay) return;

        function openMenu() {
            sidebar.classList.add('is-open');
            overlay.classList.add('is-open');
        }
        function closeMenu() {
            sidebar.classList.remove('is-open');
            overlay.classList.remove('is-open');
        }

        toggle.addEventListener('click', function () {
            sidebar.classList.contains('is-open') ? closeMenu() : openMenu();
        });
        overlay.addEventListener('click', closeMenu);

        sidebar.querySelectorAll('.nav a').forEach(function (link) {
            link.addEventListener('click', closeMenu);
        });
    })();
</script>

</div>

</body>
</html>

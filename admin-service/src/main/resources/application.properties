spring.application.name=admin-service

# -------------------------
# SERVER
# -------------------------
server.port=${PORT:8083}

# -------------------------
# DATABASE - СЪЩАТА база като transport_saas и driver-service, за да вижда
# и променя абсолютно всичко директно.
# -------------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.data-source-properties.sslMode=REQUIRED
spring.datasource.hikari.maximum-pool-size=5

# -------------------------
# JPA
# -------------------------
# ddl-auto=update само за да си създаде СОБСТВЕНАТА audit log таблица
# (as_audit_log - уникално име, за да не се сблъска с нищо от другите
# услуги). Никога не пипа съществуващите таблици на company/user/vehicle/итн,
# защото entity-тата за тях тук нямат нови колони спрямо реалната схема.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# -------------------------
# ADMIN AUTH - единственият главен администратор
# -------------------------
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:changeme}

name: Microservices CD

on:
  push:
    branches: [ "main" ]

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build JARs
        run: |
          for s in driver-service payment-service transport-saas
          do
            if [ -f "$s/pom.xml" ]; then
              echo "Building $s"
              cd $s
              mvn clean package -DskipTests
              cd ..
            fi
          done

  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Images
        run: |
          VERSION=${GITHUB_RUN_NUMBER}

          for s in driver-service payment-service transport-saas
          do
            docker build -t $DOCKERHUB_USER/$s:$VERSION ./$s
            docker push $DOCKERHUB_USER/$s:$VERSION

            docker tag $DOCKERHUB_USER/$s:$VERSION $DOCKERHUB_USER/$s:latest
            docker push $DOCKERHUB_USER/$s:latest
          done

  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd microservices
            docker-compose pull
            docker-compose up -d

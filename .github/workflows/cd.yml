name: Microservices CD

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build JARs
        run: |
          for s in driver-service payment-service transport_saas
          do
            echo "Building $s"
            cd $s
            mvn clean package -DskipTests
            cd ..
          done

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker images
        run: |
          VERSION=${GITHUB_RUN_NUMBER}

          for s in driver-service payment-service transport_saas
          do
            echo "Dockerizing $s"

            docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/$s:$VERSION ./$s
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/$s:$VERSION

            docker tag ${{ secrets.DOCKERHUB_USERNAME }}/$s:$VERSION ${{ secrets.DOCKERHUB_USERNAME }}/$s:latest
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/$s:latest
          done

name: Microservices CD

on:
  push:
    branches: ["main", "azure-terraform"]

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build all microservices
        run: |
          for s in driver-service payment-service transport_saas
          do
            echo "Building $s"
            cd $s
            mvn clean package -DskipTests
            cd ..
          done

  docker-build-push:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push images
        run: |
          VERSION=${GITHUB_RUN_NUMBER}

          for s in driver-service payment-service transport_saas
          do
            echo "Dockerizing $s"

            docker build -t $DOCKERHUB_USER/$s:$VERSION ./$s
            docker push $DOCKERHUB_USER/$s:$VERSION

            docker tag $DOCKERHUB_USER/$s:$VERSION $DOCKERHUB_USER/$s:latest
            docker push $DOCKERHUB_USER/$s:latest
          done

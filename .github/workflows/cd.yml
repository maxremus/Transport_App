name: Microservices CD

on:
  push:
    branches: ["main", "azure-terraform"]

env:
  ACR_NAME: transportappacr2026
  ACR_LOGIN_SERVER: transportappacr2026.azurecr.io
  RESOURCE_GROUP: rg-transport-app
  CONTAINER_APP: transport-saas

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build transport-saas
        run: |
          cd transport_saas
          mvn clean package -DskipTests

  docker-build-push:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name $ACR_NAME

      - name: Build and Push transport-saas
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/transport-saas:${{ github.sha }} \
            ./transport_saas

          docker push \
            $ACR_LOGIN_SERVER/transport-saas:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_LOGIN_SERVER/transport-saas:${{ github.sha }}
# -------------------------
# APP
# -------------------------

spring.application.name=driver-service


# -------------------------
# SERVER
# -------------------------

server.port=${PORT:8081}


# -------------------------
# DATABASE
# -------------------------

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.data-source-properties.sslMode=REQUIRED
spring.datasource.hikari.maximum-pool-size=5


# -------------------------
# JPA
# -------------------------

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------
# SECURITY (server-to-server)
# -------------------------

# Споделен таен ключ - трябва да съвпада с app.internal-key в transport_saas.
# transport_saas го праща като X-API-KEY заглавка при всяко извикване насам.
app.internal-key=${INTERNAL_API_KEY}


management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
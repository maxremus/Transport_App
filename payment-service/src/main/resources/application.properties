spring.application.name=payment-service

# SERVER (was missing -> service didn't bind to Render's assigned $PORT)
server.port=${PORT:8082}

# Public URL of transport_saas - Stripe redirects the user's browser here
# after checkout (must be a PUBLIC url, e.g. https://transport-saas.onrender.com)
app.frontend-url=${TRANSPORT_SAAS_PUBLIC_URL:http://localhost:8080}

# Internal URL of transport_saas, used for server-to-server Feign calls
transport.service.url=${TRANSPORT_SERVICE_URL:http://localhost:8080}

# Shared secret sent as X-API-KEY when calling transport_saas
# (must match transport_saas's app.internal-key)
app.internal-key=${INTERNAL_API_KEY}

# STRIPE
stripe.secret.key=${STRIPE_SECRET_KEY}
# Never hardcode this - it must come from the webhook endpoint you create
# in the Stripe dashboard for THIS deployment.
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

stripe.price.pro=${STRIPE_PRICE_PRO:price_1TQpGBCvYGKkxV8X0ZlPcE6E}
stripe.price.premium=${STRIPE_PRICE_PREMIUM:price_1TQpGaCvYGKkxV8XzNEYogm9}

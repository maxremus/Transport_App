# Render Blueprint - деплойва трите Spring Boot услуги като отделни
# web services в един workspace и ги свързва по вътрешната мрежа на Render.
#
# Преди деплой:
#   1. Push-ни репото в GitHub/GitLab.
#   2. В Render Dashboard -> New -> Blueprint -> избери репото.
#   3. Render ще прочете този файл и ще попита за стойностите с "sync: false"
#      (пароли/тайни) - въведи ги в диалога.
#   4. Render НЯМА managed MySQL - трябва външна MySQL база
#      (напр. Aiven, PlanetScale, Railway) - DATABASE_URL трябва да е в
#      JDBC формат: jdbc:mysql://host:port/dbname
#   5. След първия деплой копирай публичния URL на transport-saas
#      (https://transport-saas-XXXX.onrender.com) и го сложи в
#      TRANSPORT_SAAS_PUBLIC_URL на payment-service, за да работят коректно
#      redirect-ите след плащане, и в Stripe Dashboard -> Webhooks посочи
#      https://payment-service-XXXX.onrender.com/webhook
#      и копирай получения "Signing secret" в STRIPE_WEBHOOK_SECRET.

services:
  # ---------------------------------------------------------------------
  # transport_saas - основното SaaS приложение (Thymeleaf UI + REST)
  # ---------------------------------------------------------------------
  - type: web
    name: transport-saas
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./transport_saas/dockerfile
    dockerContext: ./transport_saas
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080

      # MySQL база - попълни в Render Dashboard при първи деплой
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # Споделен таен ключ за server-to-server извиквания от payment-service
      - key: INTERNAL_API_KEY
        generateValue: true

      # Вътрешен адрес на driver-service (auto-resolved от Render)
      - key: DRIVER_SERVICE_HOSTPORT
        fromService:
          name: driver-service
          type: web
          property: hostport
      - key: DRIVER_SERVICE_URL
        value: http://${DRIVER_SERVICE_HOSTPORT}

      # Вътрешен адрес на payment-service (auto-resolved от Render)
      - key: PAYMENT_SERVICE_HOSTPORT
        fromService:
          name: payment-service
          type: web
          property: hostport
      - key: PAYMENT_SERVICE_URL
        value: http://${PAYMENT_SERVICE_HOSTPORT}

  # ---------------------------------------------------------------------
  # driver-service - отделен REST микросървис за шофьори/документи
  # ---------------------------------------------------------------------
  - type: web
    name: driver-service
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./driver-service/dockerfile
    dockerContext: ./driver-service
    healthCheckPath: /api/v1/drivers
    envVars:
      - key: PORT
        value: 8081
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # Взема се автоматично от transport-saas, за да е гарантирано,
      # че двата ключа съвпадат (driver-service вече проверява X-API-KEY
      # на всяка заявка от transport_saas)
      - key: INTERNAL_API_KEY
        fromService:
          name: transport-saas
          type: web
          envVarKey: INTERNAL_API_KEY

  # ---------------------------------------------------------------------
  # payment-service - Stripe checkout + webhook, без собствена база
  # ---------------------------------------------------------------------
  - type: web
    name: payment-service
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./payment-service/dockerfile
    dockerContext: ./payment-service
    envVars:
      - key: PORT
        value: 8082

      # Взема се автоматично от transport-saas, за да е гарантирано,
      # че двата ключа съвпадат
      - key: INTERNAL_API_KEY
        fromService:
          name: transport-saas
          type: web
          envVarKey: INTERNAL_API_KEY

      - key: TRANSPORT_SERVICE_HOSTPORT
        fromService:
          name: transport-saas
          type: web
          property: hostport
      - key: TRANSPORT_SERVICE_URL
        value: http://${TRANSPORT_SERVICE_HOSTPORT}

      # ВАЖНО: попълни ръчно с публичния https://transport-saas-XXXX.onrender.com
      # адрес след първия деплой (Stripe пренасочва браузъра, не може да
      # ползва вътрешния адрес)
      - key: TRANSPORT_SAAS_PUBLIC_URL
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false

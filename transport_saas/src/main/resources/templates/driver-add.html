<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Шофьор - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="road-shell">

<div class="road-card">

    <div class="road-brand"><span class="dot"></span> Transport Manager</div>

    <h3 class="road-title" th:text="${editDriver != null} ? '✏ Редакция на шофьор' : 'Нов шофьор'"></h3>
    <p class="road-sub" th:text="${editDriver != null} ? 'Обнови данните на члена на екипажа' : 'Добави член на екипажа'"></p>

    <form th:action="${editDriver != null} ? @{'/drivers/' + ${editDriver.id}} : @{/drivers/add}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <div class="mb-3">
            <label class="field-label">Име</label>
            <input type="text" name="name" class="field-control" required
                   th:value="${editDriver != null} ? ${editDriver.name} : ''">
        </div>

        <div class="mb-4">
            <label class="field-label">Телефон</label>
            <input type="text" name="phone" class="field-control" required
                   th:value="${editDriver != null} ? ${editDriver.phone} : ''">
        </div>

        <button class="btn-route btn-block mb-2"
                th:text="${editDriver != null} ? '💾 Запази промените' : '💾 Запази шофьор'">
        </button>
        <a th:href="@{/driver}" class="btn-ghost btn-block">⬅ Назад към списъка</a>

    </form>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="road-shell">

<div class="road-card">

    <div class="road-brand"><span class="dot"></span> Transport Manager</div>

    <h3 class="road-title">Вход</h3>
    <p class="road-sub">Влез в диспечерския си акаунт</p>

    <form th:action="@{/login}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <div class="mb-3">
            <label class="field-label">Потребителско име</label>
            <input type="text" name="username"
                   class="field-control"
                   placeholder="Въведете потребителско име"
                   required>
        </div>

        <div class="mb-4">
            <label class="field-label">Парола</label>
            <input type="password" name="password"
                   class="field-control"
                   placeholder="Въведете парола"
                   required>
        </div>

        <button type="submit" class="btn-route btn-block mb-2">
            Вход
        </button>

        <a th:href="@{/}" class="btn-ghost btn-block">
            🏠 Начало
        </a>

    </form>

    <div th:if="${param.error}" class="notice notice-danger text-center mt-3 mb-0">
        Невалидно потребителско име или парола.
    </div>

    <div th:if="${param.logout}" class="notice notice-ok text-center mt-3 mb-0">
        Успешно излязохте от системата.
    </div>

    <p class="text-center text-muted-c mt-4 mb-0" style="font-size:14px;">
        Нямате акаунт?
        <a th:href="@{/register}" style="font-weight:600;">Регистрация</a>
    </p>

</div>

</body>
</html>

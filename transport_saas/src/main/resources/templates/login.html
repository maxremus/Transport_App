<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход - Transport SaaS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
        }

        .login-card {
            border-radius: 16px;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center">

<div class="card shadow-lg p-4 login-card" style="width: 380px;">

    <div class="text-center mb-4">
        <h3>Transport SaaS</h3>
        <p class="text-muted">Вход в системата</p>
    </div>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label class="form-label">Потребителско име</label>
            <input type="text" name="username"
                   class="form-control"
                   placeholder="Въведете потребителско име"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Парола</label>
            <input type="password" name="password"
                   class="form-control"
                   placeholder="Въведете парола"
                   required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">
            Вход
        </button>

        <a th:href="@{/}" class="btn btn-home w-100 mb-3">
            🏠 Начало
        </a>

    </form>

    <div th:if="${param.error}" class="alert alert-danger text-center p-2">
        Невалидно потребителско име или парола.
    </div>

    <div th:if="${param.logout}" class="alert alert-success text-center p-2">
        Успешно излязохте от системата.
    </div>

    <div class="text-center mt-3">
        <small>
            Нямате акаунт?
            <a th:href="@{/register}">Регистрация</a>
        </small>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редакция на фактура - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('invoices')}"></div>

    <div class="app-content">

        <div class="page-head">
            <div>
                <p class="page-eyebrow">Продажби</p>
                <h1 class="page-title">Редакция на фактура № <span th:text="${invoice.invoiceNumber}"></span></h1>
            </div>
            <a th:href="@{/invoices}" class="btn-ghost">← Обратно към фактурите</a>
        </div>

        <div class="panel">
            <div class="panel-body">

                <p style="margin-bottom:18px; opacity:0.75;">
                    Клиент: <strong th:text="${invoice.client != null ? invoice.client.name : '—'}"></strong>
                    &nbsp;·&nbsp; Статус: <strong th:text="${invoice.status}"></strong>
                </p>

                <form th:action="@{'/invoices/' + ${invoice.id}}" method="post">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="row g-3 mb-4">
                        <div class="col-md-3">
                            <label class="field-label">Падеж</label>
                            <input type="date" name="dueDate" class="field-control" th:value="${invoice.dueDate}">
                        </div>

                        <div class="col-md-3" th:if="${vatRegistered}">
                            <label class="field-label">ДДС %</label>
                            <input type="number" step="0.01" name="vatRate" class="field-control mono"
                                   th:value="${invoice.vatRate}">
                        </div>

                        <div class="col-md-6">
                            <label class="field-label">Бележки</label>
                            <input type="text" name="notes" class="field-control" th:value="${invoice.notes}">
                        </div>
                    </div>

                    <p class="panel-title">Редове на фактурата</p>

                    <table class="manifest-table mb-3">
                        <thead>
                        <tr>
                            <th>Описание</th>
                            <th style="width:160px;">Сума (€)</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${invoice.items}">
                            <td>
                                <input type="hidden" name="itemId" th:value="${item.id}">
                                <input type="text" name="description" class="field-control" th:value="${item.description}">
                            </td>
                            <td>
                                <input type="number" step="0.01" name="amount" class="field-control mono"
                                       th:value="${item.amount}">
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <p style="font-size:12.5px; opacity:0.65; margin-bottom:20px;">
                        Сумата на фактурата се преизчислява автоматично от сборa на редовете по-горе след запис.
                    </p>

                    <button class="btn-route">💾 Запази промените</button>

                </form>

            </div>
        </div>

    </div>

</div>

</body>
</html>

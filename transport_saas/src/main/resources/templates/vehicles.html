<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{vehicles.title} + ' - Transport Manager'">МПС - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('vehicles')}"></div>

    <div class="app-content">

        <div class="page-head">
            <div>
                <p class="page-eyebrow" th:text="#{vehicles.eyebrow}">Автопарк</p>
                <h1 class="page-title" th:text="#{vehicles.title}">МПС</h1>
            </div>
        </div>

        <!-- ADD / EDIT VEHICLE -->
        <div class="panel mb-4">
            <div class="panel-body">

                <p class="panel-title" th:text="${editId != null} ? #{vehicles.form.edit} : #{vehicles.form.add}"></p>

                <form th:action="${editId != null} ? @{'/vehicles/' + ${editId}} : @{/vehicles}"
                      method="post"
                      th:object="${vehicle}"
                      class="row g-3">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <div class="col-md-8">
                        <label class="field-label" th:text="#{vehicles.field.plate}">Регистрационен номер</label>
                        <input type="text"
                               class="field-control mono"
                               th:field="*{registrationNumber}"
                               th:placeholder="#{vehicles.field.plate.placeholder}"
                               required>
                    </div>

                    <div class="col-md-4">
                        <label class="field-label" th:text="#{vehicles.field.mileage}">Текущ пробег (км)</label>
                        <input type="number"
                               class="field-control mono"
                               th:field="*{currentMileage}"
                               th:placeholder="#{vehicles.field.mileage.placeholder}">
                    </div>

                    <div class="col-md-4 d-flex align-items-end gap-2">
                        <button class="btn-route" style="flex:1;"
                                th:text="${editId != null} ? #{vehicles.save} : #{vehicles.add}">
                        </button>
                        <a th:if="${editId != null}" th:href="@{/vehicles}" class="btn-ghost" th:text="#{vehicles.cancel}">Откажи</a>
                    </div>

                </form>

            </div>
        </div>

        <!-- VEHICLES TABLE -->
        <div class="panel mb-4">
            <div class="panel-body">

                <p class="panel-title" th:text="#{vehicles.table.title}">Всички МПС</p>

                <table class="manifest-table">
                    <thead>
                    <tr>
                        <th th:text="#{vehicles.col.plate}">Рег. номер</th>
                        <th th:text="#{vehicles.col.mileage}">Пробег</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="v : ${vehicles}">
                        <td><span class="plate" th:text="${v.registrationNumber}"></span></td>
                        <td class="mono" th:text="${v.currentMileage != null ? v.currentMileage + ' км' : '—'}"></td>
                        <td>
                            <a th:href="@{/vehicles(editId=${v.id})}"
                               class="btn-ghost" style="padding:5px 12px; font-size:12.5px;" th:text="#{vehicles.edit}">✏ Редакция</a>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div th:if="${vehicles.isEmpty()}" class="empty-state" th:text="#{vehicles.empty}">
                    Няма добавени МПС
                </div>

            </div>
        </div>

        <!-- ADD / EDIT DOCUMENT -->
        <div class="panel mb-4">
            <div class="panel-body">

                <p class="panel-title" th:text="${editDoc != null} ? #{vehicles.doc.form.edit} : #{vehicles.doc.form.add}"></p>

                <form th:action="${editDoc != null} ? @{'/documents/' + ${editDoc.id}} : @{/documents}"
                      method="post" class="row g-3">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <div class="col-md-3">
                        <label class="field-label" th:text="#{vehicles.doc.field.vehicle}">МПС</label>
                        <select name="vehicleId" class="field-control" required
                                th:disabled="${editDoc != null}">
                            <option value="" th:text="#{vehicles.doc.field.vehicle.placeholder}">-- МПС --</option>
                            <option th:each="v : ${vehicles}"
                                    th:value="${v.id}"
                                    th:selected="${editDoc != null and editDoc.vehicle.id == v.id}"
                                    th:text="${v.registrationNumber}">
                            </option>
                        </select>
                        <!-- при редакция МПС-то е readonly визуално, но пращаме id-то скрито -->
                        <input th:if="${editDoc != null}" type="hidden" name="vehicleId" th:value="${editDoc.vehicle.id}">
                    </div>

                    <div class="col-md-3">
                        <label class="field-label" th:text="#{vehicles.doc.field.type}">Тип документ</label>
                        <select name="type" class="field-control">
                            <option value="TECHNICAL_INSPECTION"
                                    th:selected="${editDoc != null and editDoc.type.name() == 'TECHNICAL_INSPECTION'}"
                                    th:text="#{doc.type.technical_inspection}">ГТП</option>
                            <option value="INSURANCE"
                                    th:selected="${editDoc != null and editDoc.type.name() == 'INSURANCE'}"
                                    th:text="#{doc.type.insurance}">Застраховка</option>
                            <option value="VIGNETTE"
                                    th:selected="${editDoc != null and editDoc.type.name() == 'VIGNETTE'}"
                                    th:text="#{doc.type.vignette}">Винетка</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="field-label" th:text="#{vehicles.doc.field.validuntil}">Валиден до</label>
                        <input type="date" name="expiryDate" class="field-control" required
                               th:value="${editDoc != null} ? ${editDoc.expiryDate} : ''">
                    </div>

                    <div class="col-md-3 d-flex align-items-end gap-2">
                        <button class="btn-ink" style="flex:1;"
                                th:text="${editDoc != null} ? #{vehicles.doc.save} : #{vehicles.doc.add}">
                        </button>
                        <a th:if="${editDoc != null}" th:href="@{/vehicles}" class="btn-ghost" th:text="#{vehicles.cancel}">Откажи</a>
                    </div>

                </form>

            </div>
        </div>

        <!-- DOCUMENTS TABLE -->
        <div class="panel">
            <div class="panel-body">

                <p class="panel-title" th:text="#{vehicles.doc.table.title}">📋 Документи</p>

                <table class="manifest-table">
                    <thead>
                    <tr>
                        <th th:text="#{vehicles.doc.col.vehicle}">МПС</th>
                        <th th:text="#{vehicles.doc.col.type}">Тип</th>
                        <th th:text="#{vehicles.doc.col.validuntil}">Валиден до</th>
                        <th th:text="#{vehicles.doc.col.status}">Статус</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="doc : ${documents}"
                        th:classappend="
                            ${@vehicleDocumentService.getStatus(doc.expiryDate) == 'EXPIRED'} ? 'row-danger' :
                            (${@vehicleDocumentService.getStatus(doc.expiryDate) == 'URGENT'} ? 'row-warning' : '')
                        ">

                        <td><span class="plate" th:text="${doc.vehicle.registrationNumber}"></span></td>

                        <td th:text="${@vehicleDocumentService.getDisplayType(doc.type)}"></td>

                        <td class="mono" th:text="${#temporals.format(doc.expiryDate, 'dd/MM/yyyy')}"></td>

                        <td th:text="${@vehicleDocumentService.getDisplayStatus(doc.expiryDate)}"></td>

                        <td>
                            <a th:href="@{/vehicles(editDocId=${doc.id})}"
                               class="btn-ghost" style="padding:5px 12px; font-size:12.5px;">✏</a>
                        </td>

                    </tr>
                    </tbody>
                </table>

                <div th:if="${documents.isEmpty()}" class="empty-state" th:text="#{vehicles.doc.empty}">
                    Няма документи
                </div>

            </div>
        </div>

        <!-- ADD MAINTENANCE SCHEDULE -->
        <div class="panel mb-4">
            <div class="panel-body">

                <p class="panel-title" th:text="#{maintenance.form.title}">🔧 Добави график за поддръжка</p>

                <form th:action="@{/maintenance}" method="post" class="row g-3">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="col-md-3">
                        <label class="field-label" th:text="#{maintenance.field.vehicle}">МПС</label>
                        <select name="vehicleId" class="field-control" required>
                            <option value="" th:text="#{maintenance.field.vehicle.placeholder}">-- МПС --</option>
                            <option th:each="v : ${vehicles}"
                                    th:value="${v.id}"
                                    th:text="${v.registrationNumber}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="field-label" th:text="#{maintenance.field.type}">Тип</label>
                        <select name="type" class="field-control">
                            <option value="OIL_CHANGE" th:text="#{maintenance.type.oil_change}">Смяна на масло</option>
                            <option value="TIRES" th:text="#{maintenance.type.tires}">Гуми</option>
                            <option value="BRAKES" th:text="#{maintenance.type.brakes}">Спирачки</option>
                            <option value="TECHNICAL_INSPECTION" th:text="#{maintenance.type.technical_inspection}">Годишен технически преглед</option>
                            <option value="OTHER" th:text="#{maintenance.type.other}">Друго</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="field-label" th:text="#{maintenance.field.interval.months}">Интервал (месеци)</label>
                        <input type="number" name="intervalMonths" class="field-control mono" th:placeholder="#{maintenance.field.interval.months.placeholder}">
                    </div>

                    <div class="col-md-2">
                        <label class="field-label" th:text="#{maintenance.field.interval.km}">Интервал (км)</label>
                        <input type="number" name="intervalKm" class="field-control mono" th:placeholder="#{maintenance.field.interval.km.placeholder}">
                    </div>

                    <div class="col-md-2">
                        <label class="field-label" th:text="#{maintenance.field.lastservice}">Последно обслужен на</label>
                        <input type="date" name="lastServiceDate" class="field-control" th:value="${T(java.time.LocalDate).now()}">
                    </div>

                    <div class="col-md-6">
                        <label class="field-label" th:text="#{maintenance.field.note}">Бележка (за "Друго")</label>
                        <input type="text" name="description" class="field-control">
                    </div>

                    <div class="col-md-3 d-flex align-items-end">
                        <button class="btn-ink" style="width:100%;" th:text="#{maintenance.add}">💾 Добави</button>
                    </div>

                </form>

            </div>
        </div>

        <!-- MAINTENANCE TABLE -->
        <div class="panel">
            <div class="panel-body">

                <p class="panel-title" th:text="#{maintenance.table.title}">🔧 График за поддръжка</p>

                <table class="manifest-table">
                    <thead>
                    <tr>
                        <th th:text="#{maintenance.col.vehicle}">МПС</th>
                        <th th:text="#{maintenance.col.type}">Тип</th>
                        <th th:text="#{maintenance.col.last}">Последно</th>
                        <th th:text="#{maintenance.col.next.date}">Следващ (дата)</th>
                        <th th:text="#{maintenance.col.next.km}">Следващ (км)</th>
                        <th th:text="#{maintenance.col.status}">Статус</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="m : ${maintenanceSchedules}"
                        th:classappend="
                            ${@maintenanceService.getStatus(m) == 'OVERDUE'} ? 'row-danger' :
                            (${@maintenanceService.getStatus(m) == 'SOON'} ? 'row-warning' : '')
                        ">
                        <td><span class="plate" th:text="${m.vehicle.registrationNumber}"></span></td>
                        <td th:text="${@maintenanceService.getDisplayType(m.type)} + (${m.type.name() == 'OTHER' and m.description != null} ? ' (' + ${m.description} + ')' : '')"></td>
                        <td class="mono" th:text="${#temporals.format(m.lastServiceDate, 'dd/MM/yyyy')} + (${m.lastServiceMileage != null} ? ' / ' + ${m.lastServiceMileage} + ' км' : '')"></td>
                        <td class="mono" th:text="${@maintenanceService.getNextServiceDate(m) != null ? #temporals.format(@maintenanceService.getNextServiceDate(m), 'dd/MM/yyyy') : '—'}"></td>
                        <td class="mono" th:text="${@maintenanceService.getNextServiceMileage(m) != null ? @maintenanceService.getNextServiceMileage(m) + ' км' : '—'}"></td>
                        <td th:text="${@maintenanceService.getDisplayStatus(m)}"></td>
                        <td style="display:flex; gap:6px;">
                            <form th:action="@{'/maintenance/' + ${m.id} + '/serviced'}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button class="btn-ghost" style="padding:5px 12px; font-size:12.5px;" th:text="#{maintenance.serviced}">✅ Обслужен</button>
                            </form>
                            <form th:action="@{'/maintenance/' + ${m.id} + '/delete'}" method="post"
                                  th:onsubmit="'return confirm(\'' + #{maintenance.confirm.delete} + '\');'">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button class="btn-danger-ghost" style="padding:5px 12px; font-size:12.5px;">🗑</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div th:if="${maintenanceSchedules.isEmpty()}" class="empty-state" th:text="#{maintenance.empty}">
                    Няма добавени графици за поддръжка
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>МПС - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('vehicles')}"></div>

    <div class="app-content">

        <div class="page-head">
            <div>
                <p class="page-eyebrow">Автопарк</p>
                <h1 class="page-title">МПС</h1>
            </div>
        </div>

        <!-- ADD / EDIT VEHICLE -->
        <div class="panel mb-4">
            <div class="panel-body">

                <p class="panel-title" th:text="${editVehicle != null} ? '✏ Редакция на МПС' : 'Добавяне на МПС'"></p>

                <form th:action="${editVehicle != null} ? @{'/vehicles/' + ${editVehicle.id}} : @{/vehicles}"
                      method="post"
                      th:object="${editVehicle != null} ? ${editVehicle} : ${vehicle}"
                      class="row g-3">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <div class="col-md-8">
                        <label class="field-label">Регистрационен номер</label>
                        <input type="text"
                               class="field-control mono"
                               th:field="*{registrationNumber}"
                               placeholder="напр. CA1234BC"
                               required>
                    </div>

                    <div class="col-md-4 d-flex align-items-end gap-2">
                        <button class="btn-route" style="flex:1;"
                                th:text="${editVehicle != null} ? '💾 Запази' : '➕ Добави'">
                        </button>
                        <a th:if="${editVehicle != null}" th:href="@{/vehicles}" class="btn-ghost">Откажи</a>
                    </div>

                </form>

            </div>
        </div>

        <!-- VEHICLES TABLE -->
        <div class="panel mb-4">
            <div class="panel-body">

                <p class="panel-title">Всички МПС</p>

                <table class="manifest-table">
                    <thead>
                    <tr>
                        <th>Рег. номер</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="v : ${vehicles}">
                        <td><span class="plate" th:text="${v.registrationNumber}"></span></td>
                        <td>
                            <a th:href="@{/vehicles(editId=${v.id})}"
                               class="btn-ghost" style="padding:5px 12px; font-size:12.5px;">✏ Редакция</a>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div th:if="${vehicles.isEmpty()}" class="empty-state">
                    Няма добавени МПС
                </div>

            </div>
        </div>

        <!-- ADD / EDIT DOCUMENT -->
        <div class="panel mb-4">
            <div class="panel-body">

                <p class="panel-title" th:text="${editDoc != null} ? '✏ Редакция на документ' : '📄 Добави документ'"></p>

                <form th:action="${editDoc != null} ? @{'/documents/' + ${editDoc.id}} : @{/documents}"
                      method="post" class="row g-3">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <div class="col-md-3">
                        <label class="field-label">МПС</label>
                        <select name="vehicleId" class="field-control" required
                                th:disabled="${editDoc != null}">
                            <option value="">-- МПС --</option>
                            <option th:each="v : ${vehicles}"
                                    th:value="${v.id}"
                                    th:selected="${editDoc != null and editDoc.vehicle.id == v.id}"
                                    th:text="${v.registrationNumber}">
                            </option>
                        </select>
                        <!-- при редакция МПС-то е readonly визуално, но пращаме id-то скрито -->
                        <input th:if="${editDoc != null}" type="hidden" name="vehicleId" th:value="${editDoc.vehicle.id}">
                    </div>

                    <div class="col-md-3">
                        <label class="field-label">Тип документ</label>
                        <select name="type" class="field-control">
                            <option value="TECHNICAL_INSPECTION"
                                    th:selected="${editDoc != null and editDoc.type.name() == 'TECHNICAL_INSPECTION'}">ГТП</option>
                            <option value="INSURANCE"
                                    th:selected="${editDoc != null and editDoc.type.name() == 'INSURANCE'}">Застраховка</option>
                            <option value="VIGNETTE"
                                    th:selected="${editDoc != null and editDoc.type.name() == 'VIGNETTE'}">Винетка</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="field-label">Валиден до</label>
                        <input type="date" name="expiryDate" class="field-control" required
                               th:value="${editDoc != null} ? ${editDoc.expiryDate} : ''">
                    </div>

                    <div class="col-md-3 d-flex align-items-end gap-2">
                        <button class="btn-ink" style="flex:1;"
                                th:text="${editDoc != null} ? '💾 Запази' : '💾 Добави'">
                        </button>
                        <a th:if="${editDoc != null}" th:href="@{/vehicles}" class="btn-ghost">Откажи</a>
                    </div>

                </form>

            </div>
        </div>

        <!-- DOCUMENTS TABLE -->
        <div class="panel">
            <div class="panel-body">

                <p class="panel-title">📋 Документи</p>

                <table class="manifest-table">
                    <thead>
                    <tr>
                        <th>МПС</th>
                        <th>Тип</th>
                        <th>Валиден до</th>
                        <th>Статус</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="doc : ${documents}"
                        th:classappend="
                            ${@vehicleDocumentService.getDisplayStatus(doc.expiryDate) == 'ИЗТИЧАЛ'} ? 'row-danger' :
                            (${@vehicleDocumentService.getDisplayStatus(doc.expiryDate) == 'СПЕШЕН'} ? 'row-warning' : '')
                        ">

                        <td><span class="plate" th:text="${doc.vehicle.registrationNumber}"></span></td>

                        <td th:text="${@vehicleDocumentService.getDisplayType(doc.type)}"></td>

                        <td class="mono" th:text="${#temporals.format(doc.expiryDate, 'dd/MM/yyyy')}"></td>

                        <td th:text="${@vehicleDocumentService.getDisplayStatus(doc.expiryDate)}"></td>

                        <td>
                            <a th:href="@{/vehicles(editDocId=${doc.id})}"
                               class="btn-ghost" style="padding:5px 12px; font-size:12.5px;">✏</a>
                        </td>

                    </tr>
                    </tbody>
                </table>

                <div th:if="${documents.isEmpty()}" class="empty-state">
                    Няма документи
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>

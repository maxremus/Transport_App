<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>МПС - Transport SaaS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f4f6f9; }

        .layout { display:flex; }

        .sidebar {
            width:240px;
            height:100vh;
            background:#111827;
            color:white;
            position:fixed;
            top:0;
            left:0;
            padding:20px;
        }

        .sidebar a {
            display:block;
            padding:12px;
            margin-bottom:10px;
            border-radius:10px;
            color:#cbd5f5;
            text-decoration:none;
        }

        .sidebar a:hover {
            background:#1f2937;
            color:white;
        }

        .sidebar a.active {
            background:#22c55e;
            color:black;
        }

        .content {
            margin-left:240px;
            width:100%;
        }

        .card { border-radius:16px; }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <h4>🚚 Transport</h4>

        <a th:href="@{/dashboard}">📊 Dashboard</a>
        <a th:href="@{/trips}">📦 Курсове</a>

        <a th:href="@{/vehicles}" class="active">
            🚛 МПС
        </a>

        <a th:href="@{/driver}">👨‍✈️ Шофьори</a>

        <hr>

        <a th:href="@{/upgrade}">💎 Абонамент</a>
        <a th:href="@{/settings}">⚙ Настройки</a>

        <hr>

        <a th:href="@{/logout}" class="text-danger">🚪 Изход</a>
    </div>

    <!-- CONTENT -->
    <div class="content">

        <div class="container-fluid py-4">

            <!-- HEADER -->
            <div class="d-flex justify-content-between mb-4">
                <h2>🚛 МПС</h2>
            </div>

            <!-- ADD VEHICLE -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">

                    <h5 class="mb-3">Добавяне на МПС</h5>

                    <form th:action="@{/vehicles}" method="post" th:object="${vehicle}" class="row g-3">

                        <!-- CSRF -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <div class="col-md-8">
                            <input type="text"
                                   class="form-control"
                                   th:field="*{registrationNumber}"
                                   placeholder="Регистрационен номер"
                                   required>
                        </div>

                        <div class="col-md-4">
                            <button class="btn btn-primary w-100">
                                ➕ Добави
                            </button>
                        </div>

                    </form>

                </div>
            </div>

            <!-- VEHICLES TABLE -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">

                    <h5 class="mb-3">Всички МПС</h5>

                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>Рег. номер</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="v : ${vehicles}">
                            <td th:text="${v.registrationNumber}"></td>
                        </tr>
                        </tbody>
                    </table>

                    <div th:if="${vehicles.isEmpty()}" class="text-center text-muted">
                        Няма добавени МПС
                    </div>

                </div>
            </div>

            <!-- ADD DOCUMENT -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">

                    <h5 class="mb-3">📄 Добави документ</h5>

                    <form th:action="@{/documents}" method="post" class="row g-3">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <div class="col-md-3">
                            <select name="vehicleId" class="form-select" required>
                                <option value="">-- МПС --</option>
                                <option th:each="v : ${vehicles}"
                                        th:value="${v.id}"
                                        th:text="${v.registrationNumber}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <select name="type" class="form-select">
                                <option value="TECHNICAL_INSPECTION">ГТП</option>
                                <option value="INSURANCE">Застраховка</option>
                                <option value="VIGNETTE">Винетка</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <input type="date" name="expiryDate" class="form-control" required>
                        </div>

                        <div class="col-md-3">
                            <button class="btn btn-success w-100">
                                💾 Добави
                            </button>
                        </div>

                    </form>

                </div>
            </div>

            <!-- DOCUMENTS TABLE -->
            <div class="card shadow-sm">
                <div class="card-body">

                    <h5 class="mb-3">📋 Документи</h5>

                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>МПС</th>
                            <th>Тип</th>
                            <th>Валиден до</th>
                            <th>Статус</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="doc : ${documents}"
                            th:classappend="
                                ${@vehicleDocumentService.getDisplayStatus(doc.expiryDate) == 'ИЗТИЧАЛ'} ? 'table-danger' :
                                (${@vehicleDocumentService.getDisplayStatus(doc.expiryDate) == 'СПЕШЕН'} ? 'table-warning' : '')
                            ">

                            <td th:text="${doc.vehicle.registrationNumber}"></td>

                            <td th:text="${@vehicleDocumentService.getDisplayType(doc.type)}"></td>

                            <td th:text="${#temporals.format(doc.expiryDate, 'dd/MM/yyyy')}"></td>

                            <td th:text="${@vehicleDocumentService.getDisplayStatus(doc.expiryDate)}"></td>

                        </tr>
                        </tbody>
                    </table>

                    <div th:if="${documents.isEmpty()}" class="text-center text-muted">
                        Няма документи
                    </div>

                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>

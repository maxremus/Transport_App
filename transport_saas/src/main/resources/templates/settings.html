<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Настройки - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('settings')}"></div>

    <div class="app-content">

        <div class="page-head">
            <div>
                <p class="page-eyebrow">Профил</p>
                <h1 class="page-title">Настройки</h1>
            </div>
        </div>

        <div class="panel" style="max-width:560px;">
            <div class="panel-body">

                <p class="panel-title">💎 Абонамент</p>

                <p style="margin-bottom:10px;">
                    План:
                    <span class="plate plate-amber" th:text="${plan}"></span>
                </p>

                <p style="margin-bottom:10px;">
                    Статус:
                    <span th:if="${active}" class="pill pill-ok">Активен</span>
                    <span th:if="${!active}" class="pill pill-danger">Неактивен</span>
                </p>

                <p style="margin-bottom:10px;">
                    Валиден до:
                    <strong class="mono" th:text="${expiry}"></strong>
                </p>

                <p th:if="${expiry != null}" class="text-muted-c" style="margin-bottom:0;">
                    Остават
                    <strong class="mono" th:text="${T(java.time.temporal.ChronoUnit).DAYS.between(T(java.time.LocalDate).now(), expiry)}"></strong>
                    дни
                </p>

                <div class="mt-3" th:if="${!active}">
                    <a th:href="@{/upgrade}" class="btn-route">
                        💳 Плати абонамент
                    </a>
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>

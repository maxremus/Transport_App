<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Настройки</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body { background: #f4f6f9; }

        .layout { display: flex; }

        .sidebar {
            width: 240px;
            height: 100vh;
            background: #111827;
            color: white;
            position: fixed;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            padding: 10px;
            margin-bottom: 8px;
            color: #cbd5f5;
            text-decoration: none;
            border-radius: 8px;
        }

        .sidebar a:hover { background: #1f2937; }

        .content {
            margin-left: 240px;
            width: 100%;
            padding: 30px;
        }

        .card { border-radius: 15px; }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h4>🚚 Transport</h4>

        <a href="/dashboard">📊 Dashboard</a>
        <a href="/trips">📦 Курсове</a>
        <a href="/vehicles">🚛 МПС</a>
        <a href="/driver">👨‍✈️ Шофьори</a>

        <hr>

        <a href="/upgrade">💎 Абонамент</a>
        <a href="/settings" class="bg-success text-dark">⚙ Настройки</a>

        <hr>

        <a href="/logout" class="text-danger">🚪 Изход</a>
    </div>

    <!-- CONTENT -->
    <div class="content">

        <h2 class="mb-4">⚙ Настройки</h2>

        <div class="card shadow p-4">

            <h4>💎 Абонамент</h4>

            <p>
                План:
                <strong th:text="${plan}"></strong>
            </p>

            <p>
                Статус:
                <span th:if="${active}" class="text-success">Активен</span>
                <span th:if="${!active}" class="text-danger">Неактивен</span>
            </p>

            <p>
                Валиден до:
                <strong th:text="${expiry}"></strong>
            </p>

            <p th:if="${expiry != null}">
                Остават:
                <strong th:text="${T(java.time.temporal.ChronoUnit).DAYS.between(T(java.time.LocalDate).now(), expiry)}"></strong>
                дни
            </p>

            <div class="mt-3" th:if="${!active}">
                <a href="/upgrade" class="btn btn-success">
                    💳 Плати абонамент
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>

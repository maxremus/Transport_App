<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>В процес на изграждане</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #020617);
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            max-width: 450px;
            width: 100%;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .btn-back {
            margin-top: 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">🚧</div>

    <h2 class="mb-3">В процес на изграждане</h2>

    <p class="text-muted">
        Тази функционалност все още се разработва.
        Очаквайте скоро обновление.
    </p>

    <!-- Бутон назад -->
    <button onclick="history.back()" class="btn btn-warning btn-back w-100">
        ⬅ Върни се назад
    </button>

</div>

</body>
</html>

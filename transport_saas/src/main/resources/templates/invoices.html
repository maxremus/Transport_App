<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Фактури - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('invoices')}"></div>

    <div class="app-content">

        <div class="page-head">
            <div>
                <p class="page-eyebrow">Продажби</p>
                <h1 class="page-title">Фактури</h1>
            </div>
        </div>

        <!-- GENERATE NEW INVOICE -->
        <div class="panel mb-4">
            <div class="panel-body">

                <p class="panel-title">🧾 Нова фактура</p>

                <form method="get" th:action="@{/invoices}" class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="field-label">Избери клиент</label>
                        <select name="clientId" class="field-control" onchange="this.form.submit()">
                            <option value="">-- Избери клиент --</option>
                            <option th:each="c : ${clients}"
                                    th:value="${c.id}"
                                    th:selected="${selectedClientId != null and selectedClientId == c.id}"
                                    th:text="${c.name}">
                            </option>
                        </select>
                    </div>
                </form>

                <div th:if="${selectedClientId != null}">

                    <div th:if="${uninvoicedTrips == null or uninvoicedTrips.isEmpty()}" class="empty-state">
                        Няма нефактурирани курсове за този клиент
                    </div>

                    <form th:if="${uninvoicedTrips != null and !uninvoicedTrips.isEmpty()}"
                          th:action="@{/invoices/generate}" method="post">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="clientId" th:value="${selectedClientId}">

                        <table class="manifest-table mb-3">
                            <thead>
                            <tr>
                                <th></th>
                                <th>Дата</th>
                                <th>От</th>
                                <th>До</th>
                                <th>Приход</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="t : ${uninvoicedTrips}">
                                <td><input type="checkbox" name="tripIds" th:value="${t.id}"></td>
                                <td class="mono" th:text="${t.tripDate != null ? #temporals.format(t.tripDate, 'dd.MM.yyyy') : '—'}"></td>
                                <td th:text="${t.fromLocation}"></td>
                                <td th:text="${t.toLocation}"></td>
                                <td class="mono" th:text="${t.revenue} + ' €'"></td>
                            </tr>
                            </tbody>
                        </table>

                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="field-label">Падеж</label>
                                <input type="date" name="dueDate" class="field-control"
                                       th:value="${T(java.time.LocalDate).now().plusDays(14)}">
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <button class="btn-route" style="width:100%;">💾 Генерирай фактура</button>
                            </div>
                        </div>

                    </form>
                </div>

            </div>
        </div>

        <!-- INVOICES TABLE -->
        <div class="panel">
            <div class="panel-body">

                <p class="panel-title">Всички фактури</p>

                <table class="manifest-table">
                    <thead>
                    <tr>
                        <th>№</th>
                        <th>Клиент</th>
                        <th>Издадена</th>
                        <th>Падеж</th>
                        <th>Сума</th>
                        <th>Статус</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inv : ${invoices}">
                        <td class="mono" th:text="${inv.invoiceNumber}"></td>
                        <td th:text="${inv.client != null ? inv.client.name : '—'}"></td>
                        <td class="mono" th:text="${inv.issueDate != null ? #temporals.format(inv.issueDate, 'dd.MM.yyyy') : '—'}"></td>
                        <td class="mono" th:text="${inv.dueDate != null ? #temporals.format(inv.dueDate, 'dd.MM.yyyy') : '—'}"></td>
                        <td class="mono fw-bold" th:text="${inv.totalAmount} + ' €'"></td>
                        <td th:text="${inv.status}"></td>
                        <td style="display:flex; gap:6px;">
                            <a th:href="@{'/invoices/' + ${inv.id} + '/pdf'}" class="btn-ghost" style="padding:5px 12px; font-size:12.5px;">⬇ PDF</a>

                            <form th:if="${inv.status.name() == 'ISSUED'}"
                                  th:action="@{'/invoices/' + ${inv.id} + '/paid'}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button class="btn-ghost" style="padding:5px 12px; font-size:12.5px;">✅ Платена</button>
                            </form>

                            <form th:if="${inv.status.name() == 'ISSUED'}"
                                  th:action="@{'/invoices/' + ${inv.id} + '/cancel'}" method="post"
                                  onsubmit="return confirm('Анулиране на фактурата?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button class="btn-danger-ghost" style="padding:5px 12px; font-size:12.5px;">🗑 Анулирай</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div th:if="${invoices == null or invoices.isEmpty()}" class="empty-state">
                    Няма издадени фактури
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>

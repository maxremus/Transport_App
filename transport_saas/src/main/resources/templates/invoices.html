<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{invoices.title} + ' - Transport Manager'">Фактури - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('invoices')}"></div>

    <div class="app-content">

        <div class="page-head">
            <div>
                <p class="page-eyebrow" th:text="#{invoices.eyebrow}">Продажби</p>
                <h1 class="page-title" th:text="#{invoices.title}">Фактури</h1>
            </div>
        </div>

        <!-- OVERDUE ALERT -->
        <div th:if="${overdueInvoices != null and !overdueInvoices.isEmpty()}"
             class="panel mb-4" style="border-left:4px solid #e5484d;">
            <div class="panel-body">
                <p class="panel-title" style="color:#e5484d;">
                    <span th:text="#{invoices.overdue.title}">⚠ Просрочени фактури</span> (<span th:text="${overdueInvoices.size()}"></span>)
                </p>
                <ul style="margin:0; padding-left:18px;">
                    <li th:each="inv : ${overdueInvoices}">
                        <span th:text="${inv.invoiceNumber}"></span> —
                        <span th:text="${inv.client != null ? inv.client.name : '—'}"></span>,
                        <span th:text="#{invoices.overdue.due}">падеж</span> <span th:text="${#temporals.format(inv.dueDate, 'dd.MM.yyyy')}"></span>,
                        <span th:text="${inv.grandTotal}"></span> €
                    </li>
                </ul>
            </div>
        </div>

        <!-- GENERATE NEW INVOICE -->
        <div class="panel mb-4">
            <div class="panel-body">

                <p class="panel-title" th:text="#{invoices.new.title}">🧾 Нова фактура</p>

                <form method="get" th:action="@{/invoices}" class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="field-label" th:text="#{invoices.new.selectclient}">Избери клиент</label>
                        <select name="clientId" class="field-control" onchange="this.form.submit()">
                            <option value="" th:text="#{invoices.new.selectclient.placeholder}">-- Избери клиент --</option>
                            <option th:each="c : ${clients}"
                                    th:value="${c.id}"
                                    th:selected="${selectedClientId != null and selectedClientId == c.id}"
                                    th:text="${c.name}">
                            </option>
                        </select>
                    </div>
                </form>

                <div th:if="${selectedClientId != null}">

                    <div th:if="${uninvoicedTrips == null or uninvoicedTrips.isEmpty()}" class="empty-state" th:text="#{invoices.new.notrips}">
                        Няма нефактурирани курсове за този клиент
                    </div>

                    <form th:if="${uninvoicedTrips != null and !uninvoicedTrips.isEmpty()}"
                          th:action="@{/invoices/generate}" method="post">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="clientId" th:value="${selectedClientId}">

                        <table class="manifest-table mb-3">
                            <thead>
                            <tr>
                                <th></th>
                                <th th:text="#{invoices.new.col.date}">Дата</th>
                                <th th:text="#{invoices.new.col.from}">От</th>
                                <th th:text="#{invoices.new.col.to}">До</th>
                                <th th:text="#{invoices.new.col.revenue}">Приход</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="t : ${uninvoicedTrips}">
                                <td><input type="checkbox" name="tripIds" th:value="${t.id}"></td>
                                <td class="mono" th:text="${t.tripDate != null ? #temporals.format(t.tripDate, 'dd.MM.yyyy') : '—'}"></td>
                                <td th:text="${t.fromLocation}"></td>
                                <td th:text="${t.toLocation}"></td>
                                <td class="mono" th:text="${t.revenue} + ' €'"></td>
                            </tr>
                            </tbody>
                        </table>

                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="field-label" th:text="#{invoices.new.duedate}">Падеж</label>
                                <input type="date" name="dueDate" class="field-control"
                                       th:value="${T(java.time.LocalDate).now().plusDays(14)}">
                            </div>
                            <div class="col-md-3" th:if="${vatRegistered}">
                                <label class="field-label" th:text="#{invoices.new.vat}">ДДС %</label>
                                <input type="number" step="0.01" name="vatRate" class="field-control mono" value="20">
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <button class="btn-route" style="width:100%;" th:text="#{invoices.new.generate}">💾 Генерирай фактура</button>
                            </div>
                        </div>

                    </form>
                </div>

            </div>
        </div>

        <!-- INVOICES TABLE -->
        <div class="panel">
            <div class="panel-body">

                <p class="panel-title" th:text="#{invoices.table.title}">Всички фактури</p>

                <table class="manifest-table">
                    <thead>
                    <tr>
                        <th th:text="#{invoices.col.number}">№</th>
                        <th th:text="#{invoices.col.client}">Клиент</th>
                        <th th:text="#{invoices.col.issued}">Издадена</th>
                        <th th:text="#{invoices.col.due}">Падеж</th>
                        <th th:text="#{invoices.col.amount}">Сума</th>
                        <th th:text="#{invoices.col.vat}">ДДС</th>
                        <th th:text="#{invoices.col.total}">Общо (с ДДС)</th>
                        <th th:text="#{invoices.col.status}">Статус</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inv : ${invoices}"
                        th:classappend="${inv.status.name() == 'ISSUED' and inv.dueDate != null and inv.dueDate.isBefore(T(java.time.LocalDate).now())} ? 'row-danger' : ''">
                        <td class="mono" th:text="${inv.invoiceNumber}"></td>
                        <td th:text="${inv.client != null ? inv.client.name : '—'}"></td>
                        <td class="mono" th:text="${inv.issueDate != null ? #temporals.format(inv.issueDate, 'dd.MM.yyyy') : '—'}"></td>
                        <td class="mono" th:text="${inv.dueDate != null ? #temporals.format(inv.dueDate, 'dd.MM.yyyy') : '—'}"></td>
                        <td class="mono" th:text="${inv.totalAmount} + ' €'"></td>
                        <td class="mono" th:text="${inv.vatRate} + '% / ' + ${inv.vatAmount} + ' €'"></td>
                        <td class="mono fw-bold" th:text="${inv.grandTotal} + ' €'"></td>
                        <td th:text="#{${'invoice.status.' + #strings.toLowerCase(inv.status.name())}}"></td>
                        <td style="display:flex; gap:6px;">
                            <a th:href="@{'/invoices/' + ${inv.id} + '/pdf'}" class="btn-ghost" style="padding:5px 12px; font-size:12.5px;" th:text="#{invoices.action.pdf}">⬇ PDF</a>

                            <a th:if="${inv.status.name() != 'CANCELLED'}"
                               th:href="@{'/invoices/' + ${inv.id} + '/edit'}"
                               class="btn-ghost" style="padding:5px 12px; font-size:12.5px;" th:text="#{invoices.action.edit}">✏ Редакция</a>

                            <form th:if="${inv.status.name() == 'ISSUED'}"
                                  th:action="@{'/invoices/' + ${inv.id} + '/paid'}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button class="btn-ghost" style="padding:5px 12px; font-size:12.5px;" th:text="#{invoices.action.paid}">✅ Платена</button>
                            </form>

                            <form th:if="${inv.status.name() == 'ISSUED'}"
                                  th:action="@{'/invoices/' + ${inv.id} + '/cancel'}" method="post"
                                  th:onsubmit="'return confirm(\'' + #{invoices.confirm.cancel} + '\');'">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button class="btn-danger-ghost" style="padding:5px 12px; font-size:12.5px;" th:text="#{invoices.action.cancel}">🗑 Анулирай</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div th:if="${invoices == null or invoices.isEmpty()}" class="empty-state" th:text="#{invoices.empty}">
                    Няма издадени фактури
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Табло - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="app-shell">

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

    <div class="app-content">

        <div class="page-head">
            <div>
                <p class="page-eyebrow">Диспечерско табло</p>
                <h1 class="page-title">Табло</h1>
            </div>
        </div>

        <!-- FILTER -->
        <div class="panel mb-4">
            <div class="panel-body">

                <form method="get" th:action="@{/dashboard}" class="row g-3 align-items-end">

                    <div class="col-md-4">
                        <label class="field-label">Месец</label>
                        <select name="month" class="field-control">
                            <option th:each="m : ${#numbers.sequence(1,12)}"
                                    th:value="${m}"
                                    th:selected="${m == selectedMonth}"
                                    th:text="${m}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="field-label">Година</label>
                        <select name="year" class="field-control">
                            <option th:each="y : ${#numbers.sequence(2023,2035)}"
                                    th:value="${y}"
                                    th:selected="${y == selectedYear}"
                                    th:text="${y}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <button class="btn-route btn-block">Филтрирай</button>
                    </div>

                </form>

            </div>
        </div>

        <!-- KPI -->
        <div class="row g-3 mb-4">

            <div class="col-md-3 col-6">
                <div class="kpi-card">
                    <p class="kpi-label">Приход</p>
                    <p class="kpi-value up mono" th:text="${revenue} + ' €'"></p>
                </div>
            </div>

            <div class="col-md-3 col-6">
                <div class="kpi-card">
                    <p class="kpi-label">Разходи</p>
                    <p class="kpi-value down mono" th:text="${expenses} + ' €'"></p>
                </div>
            </div>

            <div class="col-md-3 col-6">
                <div class="kpi-card">
                    <p class="kpi-label">Печалба</p>
                    <p class="kpi-value neutral mono" th:text="${profit} + ' €'"></p>
                </div>
            </div>

            <div class="col-md-3 col-6" th:if="${topTrip != null}">
                <div class="kpi-card" style="border-color: var(--route);">
                    <p class="kpi-label">🚀 Най-печеливш курс</p>
                    <p class="kpi-value neutral" style="font-size:16px;">
                        Курс № <span th:text="${topTrip[0]}"></span>
                    </p>
                    <p class="text-muted-c mono" style="font-size:12px; margin:2px 0;" th:text="${topTrip[1]}"></p>
                    <p class="mono" style="color:var(--signal-green); font-weight:700; margin:0;" th:text="${topTrip[2]} + ' €'"></p>
                </div>
            </div>

        </div>

        <!-- ИЗТИЧАЩИ ДОКУМЕНТИ -->
        <div class="panel mb-4" th:if="${expiringDocs != null && !expiringDocs.isEmpty()}">
            <div class="panel-body">

                <p class="panel-title" style="color: var(--signal-red);">
                    ⚠ Изтичащи документи (до 30 дни)
                </p>

                <table class="manifest-table">
                    <thead>
                    <tr>
                        <th>МПС</th>
                        <th>Документ</th>
                        <th>Валиден до</th>
                        <th>Статус</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="doc : ${expiringDocs}"
                        th:classappend="
                ${doc.expiryDate.isBefore(T(java.time.LocalDate).now())} ? 'row-danger' :
                (${doc.expiryDate.isBefore(T(java.time.LocalDate).now().plusDays(10))} ? 'row-warning' : '')
            ">
                        <td><span class="plate" th:text="${doc.vehicle.registrationNumber}"></span></td>
                        <td th:text="${@vehicleDocumentService.getDisplayType(doc.type)}"></td>
                        <td class="mono" th:text="${doc.expiryDate}"></td>
                        <td th:text="${@vehicleDocumentService.getDisplayStatus(doc.expiryDate)}"></td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>

        <!-- ИЗТИЧАЩИ ДОКУМЕНТИ НА ШОФЬОРИ -->
        <div class="panel mb-4" th:if="${expiringDriverDocs != null && !expiringDriverDocs.isEmpty()}">
            <div class="panel-body">

                <p class="panel-title" style="color: var(--signal-red);">
                    ⚠ Изтичащи документи на шофьори (до 30 дни)
                </p>

                <table class="manifest-table">
                    <thead>
                    <tr>
                        <th>Шофьор</th>
                        <th>Документ</th>
                        <th>Валиден до</th>
                        <th>Статус</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="doc : ${expiringDriverDocs}"
                        th:classappend="
                ${doc.expiryDate.isBefore(T(java.time.LocalDate).now())} ? 'row-danger' :
                (${doc.expiryDate.isBefore(T(java.time.LocalDate).now().plusDays(10))} ? 'row-warning' : '')
            ">
                        <td>
                            <a th:href="@{/driver-documents(driverId=${doc.driverId})}" th:text="${doc.driverName}"></a>
                        </td>
                        <td th:text="${@driverDocumentService.getDisplayType(doc.type)}"></td>
                        <td class="mono" th:text="${doc.expiryDate}"></td>
                        <td th:text="${@driverDocumentService.getDisplayStatus(doc.expiryDate)}"></td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>

        <!-- CHART -->
        <div class="panel">
            <div class="panel-body">
                <p class="panel-title">Финансова статистика</p>
                <canvas id="financeChart" height="90"></canvas>
            </div>
        </div>

    </div>

</div>

<script th:inline="javascript">
    let chartData = [[${chartData}]];

    let labels = [];
    let revenue = [];
    let expenses = [];
    let profit = [];

    chartData.forEach(row => {
        labels.push("Месец " + row[0]);
        revenue.push(row[1]);
        expenses.push(row[2]);
        profit.push(row[1] - row[2]);
    });

    new Chart(document.getElementById("financeChart"), {
        type: "line",
        data: {
            labels: labels,
            datasets: [
                { label: "Приход", data: revenue, borderColor: "#3C8C6B", backgroundColor: "#3C8C6B", borderWidth: 3, tension: .3 },
                { label: "Разходи", data: expenses, borderColor: "#C1442E", backgroundColor: "#C1442E", borderWidth: 3, tension: .3 },
                { label: "Печалба", data: profit, borderColor: "#D98A2B", backgroundColor: "#D98A2B", borderWidth: 3, tension: .3 }
            ]
        },
        options: {
            plugins: { legend: { labels: { font: { family: "Inter" } } } },
            scales: {
                x: { grid: { display: false } },
                y: { grid: { color: "#ECE7DA" } }
            }
        }
    });
</script>

</body>
</html>

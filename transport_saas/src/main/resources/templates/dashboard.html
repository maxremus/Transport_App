<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Табло - Transport SaaS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: #f4f6f9;
        }

        /* LAYOUT */
        .layout {
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: #111827;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
        }

        .sidebar h4 {
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            color: #cbd5f5;
            text-decoration: none;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background: #1f2937;
            color: white;
        }

        .sidebar a.active {
            background: #22c55e;
            color: black;
        }

        /* CONTENT */
        .content {
            margin-left: 240px;
            width: 100%;
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <h4>🚚 Transport</h4>

        <a th:href="@{/dashboard}"
           th:classappend="${currentPage == 'dashboard'} ? 'active'">
            📊 Dashboard
        </a>

        <a th:href="@{/trips}">📦 Курсове</a>
        <a th:href="@{/vehicles}">🚛 МПС</a>
        <a th:href="@{/driver}">👨‍✈️ Шофьори</a>

        <hr>

        <a th:href="@{/upgrade}">💎 Абонамент</a>
        <a th:href="@{/settings}">⚙ Настройки</a>

        <hr>

        <a th:href="@{/logout}" class="text-danger">🚪 Изход</a>

    </div>

    <!-- CONTENT -->
    <div class="content">


        <div class="container-fluid py-4">

            <!-- FILTER -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">

                    <form method="get" th:action="@{/dashboard}" class="row g-3">

                        <div class="col-md-4">
                            <label class="form-label">Месец</label>
                            <select name="month" class="form-select">
                                <option th:each="m : ${#numbers.sequence(1,12)}"
                                        th:value="${m}"
                                        th:selected="${m == selectedMonth}"
                                        th:text="${m}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Година</label>
                            <select name="year" class="form-select">
                                <option th:each="y : ${#numbers.sequence(2023,2035)}"
                                        th:value="${y}"
                                        th:selected="${y == selectedYear}"
                                        th:text="${y}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-4 d-flex align-items-end">
                            <button class="btn btn-primary w-100">
                                Филтрирай
                            </button>
                        </div>

                    </form>

                </div>
            </div>

            <!-- KPI -->
            <div class="row mb-4">

                <div class="col-md-3">
                    <div class="card shadow-sm text-center">
                        <div class="card-body">
                            <h6 class="text-muted">Приход</h6>
                            <h3 class="text-success"
                                th:text="${revenue} + ' €'"></h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card shadow-sm text-center">
                        <div class="card-body">
                            <h6 class="text-muted">Разходи</h6>
                            <h3 class="text-danger"
                                th:text="${expenses} + ' €'"></h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card shadow-sm text-center">
                        <div class="card-body">
                            <h6 class="text-muted">Печалба</h6>
                            <h3 class="text-primary"
                                th:text="${profit} + ' €'"></h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3" th:if="${topTrip != null}">
                    <div class="card shadow-sm text-center bg-success-subtle">
                        <div class="card-body">

                            <h6>🚀 Най-печеливш курс</h6>

                            <h5>
                                Курс № <span th:text="${topTrip[0]}"></span>
                            </h5>

                            <small th:text="${topTrip[1]}"></small><br>

                            <small class="text-success"
                                   th:text="${topTrip[2]} + ' €'"></small>

                        </div>
                    </div>
                </div>

            </div>

            <!-- ================= ИЗТИЧАЩИ ДОКУМЕНТИ ================= -->
            <div class="card shadow-sm mb-4"
                 th:if="${expiringDocs != null && !expiringDocs.isEmpty()}">

                <div class="card-body">

                    <h5 class="text-danger">
                        ⚠ Изтичащи документи (до 30 дни)
                    </h5>

                    <table class="table table-sm mt-3">
                        <thead>
                        <tr>
                            <th>МПС</th>
                            <th>Документ</th>
                            <th>Валиден до</th>
                            <th>Статус</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="doc : ${expiringDocs}"
                            th:classappend="
                    ${doc.expiryDate.isBefore(T(java.time.LocalDate).now())} ? 'table-danger' :
                    (${doc.expiryDate.isBefore(T(java.time.LocalDate).now().plusDays(10))} ? 'table-warning' : '')
                ">

                            <td th:text="${doc.vehicle.registrationNumber}"></td>

                            <td th:text="${@vehicleDocumentService.getDisplayType(doc.type)}"></td>

                            <td th:text="${doc.expiryDate}"></td>

                            <td th:text="${@vehicleDocumentService.getDisplayStatus(doc.expiryDate)}"></td>

                        </tr>
                        </tbody>
                    </table>

                </div>
            </div>

            <!-- CHART -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="mb-3">Финансова статистика</h5>
                    <canvas id="financeChart"></canvas>
                </div>
            </div>

        </div>
    </div>

</div>

<script th:inline="javascript">
    let chartData = [[${chartData}]];

    let labels = [];
    let revenue = [];
    let expenses = [];
    let profit = [];

    chartData.forEach(row => {
        labels.push("Месец " + row[0]);
        revenue.push(row[1]);
        expenses.push(row[2]);
        profit.push(row[1] - row[2]);
    });

    new Chart(document.getElementById("financeChart"), {
        type: "line",
        data: {
            labels: labels,
            datasets: [
                { label: "Приход", data: revenue, borderWidth: 3 },
                { label: "Разходи", data: expenses, borderWidth: 3 },
                { label: "Печалба", data: profit, borderWidth: 3 }
            ]
        }
    });
</script>

</body>
</html>

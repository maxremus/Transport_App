<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="sidebar(active)">

<button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Меню">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-sidebar" id="appSidebar">

    <div class="app-brand">
        <span class="dot"></span> Transport Manager
    </div>

    <hr class="route-line">

    <ul class="nav-stops">

        <li>
            <a th:href="@{/dashboard}" class="nav-stop"
               th:classappend="${active == 'dashboard'} ? 'is-active'">
                <span class="stop-dot"></span> Табло
            </a>
        </li>
        <li>
            <a th:href="@{/trips}" class="nav-stop"
               th:classappend="${active == 'trips'} ? 'is-active'">
                <span class="stop-dot"></span> Курсове
            </a>
        </li>
        <li>
            <a th:href="@{/vehicles}" class="nav-stop"
               th:classappend="${active == 'vehicles'} ? 'is-active'">
                <span class="stop-dot"></span> МПС
            </a>
        </li>
        <li>
            <a th:href="@{/clients}" class="nav-stop"
               th:classappend="${active == 'clients'} ? 'is-active'">
                <span class="stop-dot"></span> Клиенти
            </a>
        </li>
        <li>
            <a th:href="@{/invoices}" class="nav-stop"
               th:classappend="${active == 'invoices'} ? 'is-active'">
                <span class="stop-dot"></span> Фактури
            </a>
        </li>
        <li>
            <a th:href="@{/fuel-report}" class="nav-stop"
               th:classappend="${active == 'fuel-report'} ? 'is-active'">
                <span class="stop-dot"></span> Гориво
            </a>
        </li>
        <li>
            <a th:href="@{/driver}" class="nav-stop"
               th:classappend="${active == 'driver'} ? 'is-active'">
                <span class="stop-dot"></span> Шофьори
            </a>
        </li>
    </ul>

    <hr class="route-line">

    <ul class="nav-stops">
        <li>
            <a th:href="@{/upgrade}" class="nav-stop"
               th:classappend="${active == 'upgrade'} ? 'is-active'">
                <span class="stop-dot"></span> Абонамент
            </a>
        </li>
        <li>
            <a th:href="@{/settings}" class="nav-stop"
               th:classappend="${active == 'settings'} ? 'is-active'">
                <span class="stop-dot"></span> Настройки
            </a>
        </li>
    </ul>

    <hr class="route-line">

    <form th:action="@{/logout}" method="post" style="margin:0;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="nav-stop is-exit"
                style="width:100%; background:none; border:none; text-align:left; cursor:pointer; font:inherit;">
            <span class="stop-dot"></span> Изход
        </button>
    </form>

</div>

<script>
    (function () {
        var toggle = document.getElementById('sidebarToggle');
        var sidebar = document.getElementById('appSidebar');
        var overlay = document.getElementById('sidebarOverlay');
        if (!toggle || !sidebar || !overlay) return;

        function openMenu() {
            sidebar.classList.add('is-open');
            overlay.classList.add('is-open');
        }
        function closeMenu() {
            sidebar.classList.remove('is-open');
            overlay.classList.remove('is-open');
        }

        toggle.addEventListener('click', function () {
            sidebar.classList.contains('is-open') ? closeMenu() : openMenu();
        });
        overlay.addEventListener('click', closeMenu);

        // затваряме менюто автоматично при избор на линк - по-удобно на телефон
        sidebar.querySelectorAll('a.nav-stop').forEach(function (link) {
            link.addEventListener('click', closeMenu);
        });
    })();
</script>

</div>

</body>
</html>

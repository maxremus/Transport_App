<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Използване: <div th:replace="~{fragments/lang-switch :: switcher(dark=false)}"></div>
  dark=true за тъмен фон (напр. началната страница).
  Чисто относителен линк "?lang=bg" - браузърът го разрешава спрямо
  текущата страница автоматично, без да се налага Thymeleaf да чете
  текущия URL (нарочно избягваме #request/#httpServletRequest - версията
  на обекта се различава между версии на Thymeleaf и предизвика redirect
  loop на страници, заредени през Spring Security entry point като /login).
  LocaleChangeInterceptor чете "lang" параметъра и записва избора в
  бисквитка (важи преди логин и между сесиите).
-->
<div th:fragment="switcher(dark)" class="lang-switch" th:classappend="${dark} ? 'lang-switch-dark' : ''">
    <a href="?lang=bg"
       th:classappend="${#locale.language == 'bg'} ? 'is-active'"
       th:text="#{lang.switch.bg}">БГ</a>
    <span class="lang-sep">/</span>
    <a href="?lang=en"
       th:classappend="${#locale.language == 'en'} ? 'is-active'"
       th:text="#{lang.switch.en}">EN</a>
</div>

</body>
</html>

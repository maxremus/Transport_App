<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Клиенти - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('clients')}"></div>

    <div class="app-content">

        <div class="page-head">
            <div>
                <p class="page-eyebrow">Контрагенти</p>
                <h1 class="page-title">Клиенти</h1>
            </div>
        </div>

        <!-- ADD / EDIT CLIENT -->
        <div class="panel mb-4">
            <div class="panel-body">

                <p class="panel-title" th:text="${editId != null} ? '✏ Редакция на клиент' : 'Добавяне на клиент'"></p>

                <form th:action="${editId != null} ? @{'/clients/' + ${editId}} : @{/clients}"
                      method="post"
                      th:object="${client}"
                      class="row g-3">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <div class="col-md-4">
                        <label class="field-label">Име / Фирма</label>
                        <input type="text" class="field-control" th:field="*{name}"
                               placeholder="напр. Логистика ЕООД" required>
                    </div>

                    <div class="col-md-2">
                        <label class="field-label">ЕИК / Булстат</label>
                        <input type="text" class="field-control mono" th:field="*{bulstat}">
                    </div>

                    <div class="col-md-3">
                        <label class="field-label">Лице за контакт</label>
                        <input type="text" class="field-control" th:field="*{contactPerson}">
                    </div>

                    <div class="col-md-3">
                        <label class="field-label">Телефон</label>
                        <input type="text" class="field-control mono" th:field="*{phone}">
                    </div>

                    <div class="col-md-4">
                        <label class="field-label">Имейл</label>
                        <input type="email" class="field-control" th:field="*{email}">
                    </div>

                    <div class="col-md-8">
                        <label class="field-label">Адрес</label>
                        <input type="text" class="field-control" th:field="*{address}">
                    </div>

                    <div class="col-md-12">
                        <label class="field-label">Бележки</label>
                        <input type="text" class="field-control" th:field="*{notes}">
                    </div>

                    <div class="col-md-4 d-flex align-items-end gap-2">
                        <button class="btn-route" style="flex:1;"
                                th:text="${editId != null} ? '💾 Запази' : '➕ Добави'">
                        </button>
                        <a th:if="${editId != null}" th:href="@{/clients}" class="btn-ghost">Откажи</a>
                    </div>

                </form>

            </div>
        </div>

        <!-- CLIENTS TABLE -->
        <div class="panel">
            <div class="panel-body">

                <p class="panel-title">Всички клиенти</p>

                <table class="manifest-table">
                    <thead>
                    <tr>
                        <th>Име</th>
                        <th>ЕИК</th>
                        <th>Лице за контакт</th>
                        <th>Телефон</th>
                        <th>Имейл</th>
                        <th>Дължи</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="c : ${clients}">
                        <td th:text="${c.name}"></td>
                        <td class="mono" th:text="${c.bulstat}"></td>
                        <td th:text="${c.contactPerson}"></td>
                        <td class="mono" th:text="${c.phone}"></td>
                        <td th:text="${c.email}"></td>
                        <td class="mono fw-bold"
                            th:style="${balances.get(c.id) != null and balances.get(c.id).signum() > 0} ? 'color:#e5484d;' : ''"
                            th:text="${balances.get(c.id)} + ' €'"></td>
                        <td style="display:flex; gap:6px;">
                            <a th:href="@{/invoices(clientId=${c.id})}"
                               class="btn-ghost" style="padding:5px 12px; font-size:12.5px;">🧾 Фактура</a>
                            <a th:href="@{/clients(editId=${c.id})}"
                               class="btn-ghost" style="padding:5px 12px; font-size:12.5px;">✏ Редакция</a>
                            <form th:action="@{'/clients/delete/' + ${c.id}}" method="post"
                                  onsubmit="return confirm('Изтриване на клиента?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button class="btn-ghost" style="padding:5px 12px; font-size:12.5px;">🗑</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div th:if="${clients.isEmpty()}" class="empty-state">
                    Няма добавени клиенти
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>

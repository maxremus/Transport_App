<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{register.title} + ' - Transport Manager'">Регистрация - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body class="road-shell">

<div class="road-card wide">

    <div class="d-flex justify-content-between align-items-center">
        <div class="road-brand"><span class="dot"></span> Transport Manager</div>
        <div th:replace="~{fragments/lang-switch :: switcher(dark=false)}"></div>
    </div>

    <h3 class="road-title" th:text="#{register.heading}">Създаване на акаунт</h3>
    <p class="road-sub" th:text="#{register.eyebrow}">Регистрация на нова транспортна фирма</p>

    <form th:action="@{/register}" th:object="${request}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <div class="mb-3">
            <label class="field-label" th:text="#{register.field.company}">Име на фирмата</label>
            <input type="text"
                   th:field="*{companyName}"
                   class="field-control"
                   th:placeholder="#{register.field.company.placeholder}"
                   required>
        </div>

        <div class="mb-3">
            <label class="field-label" th:text="#{register.field.username}">Потребителско име</label>
            <input type="text"
                   th:field="*{username}"
                   class="field-control"
                   th:placeholder="#{register.field.username.placeholder}"
                   required>
        </div>

        <div class="mb-3">
            <label class="field-label" th:text="#{register.field.email}">Имейл</label>
            <input type="email"
                   th:field="*{email}"
                   class="field-control"
                   th:placeholder="#{register.field.email.placeholder}"
                   required>
        </div>

        <div class="mb-4">
            <label class="field-label" th:text="#{register.field.password}">Парола</label>
            <div class="password-wrap">
                <input type="password"
                       th:field="*{password}"
                       class="field-control"
                       th:placeholder="#{register.field.password.placeholder}"
                       required>
                <button type="button" class="password-toggle" onclick="togglePassword(this)">👁</button>
            </div>
        </div>

        <button type="submit" class="btn-route btn-block mb-2" th:text="#{register.submit}">
            Регистрация
        </button>

        <a th:href="@{/}" class="btn-ghost btn-block">
            🏠 Начало
        </a>

    </form>

    <div th:if="${error}" class="notice notice-danger text-center mt-3 mb-0"
         th:text="${error}">
    </div>

    <p class="text-center text-muted-c mt-4 mb-0" style="font-size:14px;">
        <span th:text="#{register.haveaccount}">Вече имате акаунт?</span>
        <a th:href="@{/login}" style="font-weight:600;" th:text="#{register.login.link}">Вход</a>
    </p>

</div>

</body>
</html>

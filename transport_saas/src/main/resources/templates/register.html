<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация - Transport SaaS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #134e5e, #71b280);
            height: 100vh;
        }

        .register-card {
            border-radius: 16px;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center">

<div class="card shadow-lg p-4 register-card" style="width: 420px;">

    <div class="text-center mb-4">
        <h3>Създаване на акаунт</h3>
        <p class="text-muted">Регистрация на нова фирма</p>
    </div>

    <form th:action="@{/register}" th:object="${request}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <div class="mb-3">
            <label class="form-label">Име на фирмата</label>
            <input type="text"
                   th:field="*{companyName}"
                   class="form-control"
                   placeholder="Въведете име на фирмата"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Потребителско име</label>
            <input type="text"
                   th:field="*{username}"
                   class="form-control"
                   placeholder="Изберете потребителско име"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Парола</label>
            <input type="password"
                   th:field="*{password}"
                   class="form-control"
                   placeholder="Изберете парола"
                   required>
        </div>

        <button type="submit" class="btn btn-success w-100 mb-3">
            Регистрация
        </button>

        <a th:href="@{/}" class="btn btn-home w-100 mb-3">
            🏠 Начало
        </a>

    </form>

    <div th:if="${error}" class="alert alert-danger text-center p-2"
         th:text="${error}">
    </div>

    <div class="text-center mt-3">
        <small>
            Вече имате акаунт?
            <a th:href="@{/login}">Вход</a>
        </small>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Надхвърлен лимит - Transport SaaS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .limit-card {
            max-width: 520px;
            width: 100%;
            border-radius: 16px;
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            background-color: #ffc107;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
        }
    </style>
</head>

<body>

<div class="card shadow-lg limit-card">
    <div class="card-body p-5 text-center">

        <div class="icon-circle">
            ⚠
        </div>

        <h3 class="mb-3 text-danger">Достигнат е лимитът на плана</h3>

        <p class="mb-4" th:text="${errorMessage}">
            Надхвърлили сте позволения брой записи за текущия абонамент.
        </p>

        <p class="text-muted mb-4">
            За да продължите да използвате всички функционалности,
            е необходимо да надградите своя абонаментен план.
        </p>

        <div class="d-grid gap-3">

            <a th:href="@{/upgrade}" class="btn btn-warning btn-lg">
                Надграждане на абонамент
            </a>

            <a th:href="@{/dashboard}" class="btn btn-outline-light">
                Обратно към таблото
            </a>

        </div>

    </div>
</div>

</body>
</html>

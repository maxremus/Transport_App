<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Надхвърлен лимит - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="road-shell">

<div class="road-card" style="text-align:center;">

    <div class="status-badge-circle" style="background: var(--signal-amber-bg); color: var(--signal-amber);">⚠</div>

    <h3 class="road-title" style="color: var(--signal-red);">Достигнат е лимитът на плана</h3>

    <p class="mb-3" th:text="${errorMessage}">
        Надхвърлили сте позволения брой записи за текущия абонамент.
    </p>

    <p class="text-muted-c mb-4">
        За да продължите да използвате всички функционалности,
        е необходимо да надградите своя абонаментен план.
    </p>

    <a th:href="@{/upgrade}" class="btn-route btn-block mb-2">
        Надграждане на абонамент
    </a>

    <a th:href="@{/dashboard}" class="btn-ghost btn-block">
        Обратно към таблото
    </a>

</div>

</body>
</html>

<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{forgot.title} + ' - Transport Manager'">Забравена парола - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="road-shell">

<div class="road-card">

    <div class="road-brand"><span class="dot"></span> Transport Manager</div>

    <h3 class="road-title" th:text="#{forgot.title}">Забравена парола</h3>
    <p class="road-sub" th:text="#{forgot.sub}">Ще ти пратим линк за възстановяване на имейла</p>

    <div th:if="${sent}" class="notice notice-ok text-center mb-3">
        <span th:text="#{forgot.sent}">Ако имейлът съществува в системата, изпратихме линк за възстановяване.
        Провери входящата си поща (и папка "Спам").</span>
    </div>

    <form th:if="${sent == null}" th:action="@{/forgot-password}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <div class="mb-4">
            <label class="field-label" th:text="#{forgot.field.email}">Имейл</label>
            <input type="email" name="email"
                   class="field-control"
                   placeholder="твоя@имейл.com"
                   required>
        </div>

        <button type="submit" class="btn-route btn-block" th:text="#{forgot.submit}">
            Изпрати линк за възстановяване
        </button>

    </form>

    <p class="text-center text-muted-c mt-4 mb-0" style="font-size:14px;">
        <a th:href="@{/login}" th:text="#{forgot.back}">⬅ Обратно към вход</a>
    </p>

</div>

</body>
</html>

<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{error.page.title} + ' - Transport Manager'">Грешка - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="road-shell">

<div class="road-card" style="text-align:center;">

    <div class="road-brand" style="justify-content:center;"><span class="dot"></span> Transport Manager</div>

    <p class="mono" style="font-size:56px; font-weight:700; margin:8px 0 0; color: var(--route-dark); line-height:1;"
       th:text="${status}">500</p>

    <h3 class="road-title" style="margin-top:6px;" th:text="#{${'error.status.' + statusKey + '.title'}}">Възникна грешка</h3>

    <p class="mb-3" th:text="#{${'error.status.' + statusKey + '.text'}}">
        Нещо се обърка от наша страна. Опитай отново след малко.
    </p>

    <div th:if="${userMessage != null}" class="notice notice-danger mb-3" style="text-align:left;">
        <strong th:text="#{error.reason}">Причина:</strong>
        <span th:text="${userMessage}"></span>
    </div>

    <div th:if="${causeKey != null}" class="notice notice-danger mb-3" style="text-align:left;">
        <strong th:text="#{error.reason}">Причина:</strong>
        <span th:text="#{${causeKey}}"></span>
    </div>

    <a th:if="${loggedIn}" th:href="@{/dashboard}" class="btn-route btn-block mb-2" th:text="#{error.btn.dashboard}">Към таблото</a>
    <a th:unless="${loggedIn}" th:href="@{/}" class="btn-route btn-block mb-2" th:text="#{error.btn.home}">Към началната страница</a>
    <a href="javascript:history.back()" class="btn-ghost btn-block" th:text="#{error.btn.back}">⬅ Назад</a>

    <p class="text-muted-c mono mt-4 mb-0" style="font-size:12px;">
        <span th:text="${time}"></span>
        <span th:if="${path != ''}"> · <span th:text="${path}"></span></span>
        <span th:if="${errorCode != null}"> · <span th:text="${errorCode}"></span></span>
    </p>
    <p class="text-muted-c mt-1 mb-0" style="font-size:12px;" th:text="#{error.contact}">
        Ако проблемът се повтаря, пиши ни от страница „Помощ".
    </p>

</div>

</body>
</html>

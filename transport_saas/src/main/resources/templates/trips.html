<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Курсове - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('trips')}"></div>

    <div class="app-content">

        <div class="page-head">
            <div>
                <p class="page-eyebrow">Пътни листове</p>
                <h1 class="page-title">Курсове</h1>
            </div>
        </div>

        <!-- FORM -->
        <div class="panel mb-4">
            <div class="panel-body">

                <p class="panel-title">Добавяне на курс</p>

                <form th:action="@{/trips}" method="post"
                      th:object="${trip}" class="row g-3">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <div class="col-md-4">
                        <label class="field-label">От</label>
                        <input type="text" class="field-control"
                               th:field="*{fromLocation}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="field-label">До</label>
                        <input type="text" class="field-control"
                               th:field="*{toLocation}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="field-label">МПС</label>
                        <select class="field-control" name="vehicleId" required>
                            <option value="">-- Избери МПС --</option>
                            <option th:each="v : ${vehicles}"
                                    th:value="${v.id}"
                                    th:text="${v.registrationNumber}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-3 col-6">
                        <label class="field-label">Приход (€)</label>
                        <input type="number" step="0.01"
                               class="field-control mono"
                               th:field="*{revenue}" required>
                    </div>

                    <div class="col-md-3 col-6">
                        <label class="field-label">Гориво (€)</label>
                        <input type="number" step="0.01"
                               class="field-control mono"
                               th:field="*{fuelCost}">
                    </div>

                    <div class="col-md-3 col-6">
                        <label class="field-label">Пътни такси (€)</label>
                        <input type="number" step="0.01"
                               class="field-control mono"
                               th:field="*{tollCost}">
                    </div>

                    <div class="col-md-3 col-6">
                        <label class="field-label">Други (€)</label>
                        <input type="number" step="0.01"
                               class="field-control mono"
                               th:field="*{otherCost}">
                    </div>

                    <div class="col-12">
                        <button class="btn-route btn-block">💾 Запази курс</button>
                    </div>

                </form>

            </div>
        </div>

        <!-- TABLE -->
        <div class="panel">
            <div class="panel-body">

                <p class="panel-title">Всички курсове</p>

                <table class="manifest-table">

                    <thead>
                    <tr>
                        <th>От</th>
                        <th>До</th>
                        <th>МПС</th>
                        <th>Приход</th>
                        <th>Разходи</th>
                        <th>Печалба</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="t : ${trips}">
                        <td th:text="${t.fromLocation}"></td>
                        <td th:text="${t.toLocation}"></td>
                        <td><span class="plate" th:text="${t.vehicle.registrationNumber}"></span></td>
                        <td class="mono" th:text="${t.revenue} + ' €'"></td>
                        <td class="mono" th:text="${t.totalCost} + ' €'"></td>
                        <td class="mono fw-bold" th:text="${t.profit} + ' €'"></td>
                    </tr>

                    </tbody>
                </table>

                <div th:if="${trips == null || trips.isEmpty()}" class="empty-state">
                    Няма добавени курсове
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>

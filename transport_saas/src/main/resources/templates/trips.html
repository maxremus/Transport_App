<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{trips.title} + ' - Transport Manager'">Курсове - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('trips')}"></div>

    <div class="app-content">

        <div class="page-head">
            <div>
                <p class="page-eyebrow" th:text="#{trips.eyebrow}">Пътни листове</p>
                <h1 class="page-title" th:text="#{trips.title}">Курсове</h1>
            </div>
            <a th:href="@{/trips/export}" class="btn-ghost" th:text="#{trips.export}">⬇ Excel справка</a>
        </div>

        <!-- FORM (add or edit) -->
        <div class="panel mb-4">
            <div class="panel-body">

                <p class="panel-title" th:text="${editId != null} ? #{trips.form.edit} : #{trips.form.add}"></p>

                <form th:action="${editId != null} ? @{'/trips/' + ${editId}} : @{/trips}"
                      method="post"
                      th:object="${trip}"
                      class="row g-3">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <div class="col-md-4">
                        <label class="field-label" th:text="#{trips.field.from}">От</label>
                        <input type="text" class="field-control"
                               th:field="*{fromLocation}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="field-label" th:text="#{trips.field.to}">До</label>
                        <input type="text" class="field-control"
                               th:field="*{toLocation}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="field-label" th:text="#{trips.field.vehicle}">МПС</label>
                        <select class="field-control" name="vehicleId" required>
                            <option value="" th:text="#{trips.field.vehicle.placeholder}">-- Избери МПС --</option>
                            <option th:each="v : ${vehicles}"
                                    th:value="${v.id}"
                                    th:selected="${trip.vehicle != null and trip.vehicle.id == v.id}"
                                    th:text="${v.registrationNumber}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="field-label" th:text="#{trips.field.client}">Клиент (незадължително)</label>
                        <select class="field-control" name="clientId">
                            <option value="" th:text="#{trips.field.client.placeholder}">-- Без клиент --</option>
                            <option th:each="c : ${clients}"
                                    th:value="${c.id}"
                                    th:selected="${trip.client != null and trip.client.id == c.id}"
                                    th:text="${c.name}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-3 col-6">
                        <label class="field-label" th:text="#{trips.field.revenue}">Приход (€)</label>
                        <input type="number" step="0.01"
                               class="field-control mono"
                               th:field="*{revenue}" required>
                    </div>

                    <div class="col-md-3 col-6">
                        <label class="field-label" th:text="#{trips.field.fuel}">Гориво (€)</label>
                        <input type="number" step="0.01"
                               class="field-control mono"
                               th:field="*{fuelCost}">
                    </div>

                    <div class="col-md-3 col-6">
                        <label class="field-label" th:text="#{trips.field.distance}">Изминати км</label>
                        <input type="number"
                               class="field-control mono"
                               th:field="*{distanceKm}"
                               th:placeholder="#{trips.field.distance.placeholder}">
                    </div>

                    <div class="col-md-3 col-6">
                        <label class="field-label" th:text="#{trips.field.toll}">Пътни такси (€)</label>
                        <input type="number" step="0.01"
                               class="field-control mono"
                               th:field="*{tollCost}">
                    </div>

                    <div class="col-md-3 col-6">
                        <label class="field-label" th:text="#{trips.field.other}">Други (€)</label>
                        <input type="number" step="0.01"
                               class="field-control mono"
                               th:field="*{otherCost}">
                    </div>

                    <div class="col-12 d-flex gap-2">
                        <button class="btn-route" style="flex:1;"
                                th:text="${editId != null} ? #{trips.save.edit} : #{trips.save.new}">
                        </button>
                        <a th:if="${editId != null}" th:href="@{/trips}" class="btn-ghost" th:text="#{trips.cancel}">Откажи</a>
                    </div>

                </form>

            </div>
        </div>

        <!-- TABLE -->
        <div class="panel">
            <div class="panel-body">

                <p class="panel-title" th:text="#{trips.table.title}">Всички курсове</p>

                <table class="manifest-table">

                    <thead>
                    <tr>
                        <th th:text="#{trips.col.from}">От</th>
                        <th th:text="#{trips.col.to}">До</th>
                        <th th:text="#{trips.col.vehicle}">МПС</th>
                        <th th:text="#{trips.col.client}">Клиент</th>
                        <th th:text="#{trips.col.km}">Км</th>
                        <th th:text="#{trips.col.revenue}">Приход</th>
                        <th th:text="#{trips.col.expenses}">Разходи</th>
                        <th th:text="#{trips.col.fuelperkm}">€/км гориво</th>
                        <th th:text="#{trips.col.profit}">Печалба</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="t : ${trips}">
                        <td th:text="${t.fromLocation}"></td>
                        <td th:text="${t.toLocation}"></td>
                        <td><span class="plate" th:text="${t.vehicle.registrationNumber}"></span></td>
                        <td th:text="${t.client != null ? t.client.name : '—'}"></td>
                        <td class="mono" th:text="${t.distanceKm != null ? t.distanceKm + ' км' : '—'}"></td>
                        <td class="mono" th:text="${t.revenue} + ' €'"></td>
                        <td class="mono" th:text="${t.totalCost} + ' €'"></td>
                        <td class="mono" th:text="${t.fuelCostPerKm != null ? t.fuelCostPerKm + ' €' : '—'}"></td>
                        <td class="mono fw-bold" th:text="${t.profit} + ' €'"></td>
                        <td class="d-flex gap-2">
                            <a th:href="@{/trips(editId=${t.id})}"
                               class="btn-ghost" style="padding:5px 12px; font-size:12.5px;">✏</a>

                            <form th:action="@{'/trips/delete/' + ${t.id}}" method="post"
                                  th:onsubmit="'return confirm(\'' + #{trips.confirm.delete} + '\');'">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button class="btn-danger-ghost" style="padding:5px 12px; font-size:12.5px;">🗑</button>
                            </form>
                        </td>
                    </tr>

                    </tbody>
                </table>

                <div th:if="${trips == null || trips.isEmpty()}" class="empty-state" th:text="#{trips.empty}">
                    Няма добавени курсове
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{paycancel.title} + ' - Transport Manager'">Неуспешно плащане - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="road-shell">

<div class="road-card" style="text-align:center;">

    <div class="status-badge-circle" style="background: var(--signal-red-bg); color: var(--signal-red);">✖</div>

    <h3 class="road-title" th:text="#{paycancel.title}">Плащането не беше успешно</h3>

    <p class="text-muted-c mb-4">
        <span th:text="#{paycancel.text}">Възникна проблем или плащането беше отказано.</span>
    </p>

    <a th:href="@{/upgrade}" class="btn-route btn-block mb-2">
        <span th:text="#{paycancel.retry}">Опитай отново</span>
    </a>

    <a th:href="@{/dashboard}" class="btn-ghost btn-block">
        <span th:text="#{paycancel.back}">Обратно към таблото</span>
    </a>

</div>

</body>
</html>

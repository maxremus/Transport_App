<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Абонамент изтекъл - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="road-shell">

<div class="road-card" style="text-align:center;">

    <div class="status-badge-circle" style="background: var(--signal-red-bg); color: var(--signal-red);">❌</div>

    <h3 class="road-title">Абонаментът е изтекъл</h3>

    <p class="text-muted-c mb-4">
        Моля подновете абонамента си, за да продължите да ползвате Transport Manager.
    </p>

    <a th:href="@{/upgrade}" class="btn-route btn-block">
        💳 Поднови абонамент
    </a>

</div>

</body>
</html>

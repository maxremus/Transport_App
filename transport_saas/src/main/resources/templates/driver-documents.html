<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Документи на шофьор</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <h3 class="mb-4">📄 Добавяне на документ</h3>

    <form th:action="@{/driver-documents}" method="post">

        <!-- CSRF -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <div class="mb-3">
            <label>Driver ID</label>
            <input type="number" name="driverId" class="form-control" th:value="${param.driverId}" required>
        </div>

        <div class="mb-3">
            <label>Тип документ</label>
            <select name="type" class="form-control">
                <option value="DRIVING_LICENSE">Книжка</option>
                <option value="ID_CARD">Лична карта</option>
                <option value="DIGITAL_CARD">Дигитална карта</option>
                <option value="PROFESSIONAL_CERT">Професионална</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Номер</label>
            <input type="text" name="number" class="form-control">
        </div>

        <div class="mb-3">
            <label>Валиден до</label>
            <input type="date" name="expiryDate" class="form-control">
        </div>

        <button class="btn btn-success w-100">
            💾 Запази документ
        </button>

    </form>

</div>

</body>
</html>

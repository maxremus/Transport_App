<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Документ на шофьор - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="road-shell">

<div class="road-card">

    <div class="road-brand"><span class="dot"></span> Transport Manager</div>

    <h3 class="road-title">📄 Нов документ</h3>
    <p class="road-sub">Добавяне на документ за шофьор</p>

    <form th:action="@{/driver-documents}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <div class="mb-3">
            <label class="field-label">ID на шофьор</label>
            <input type="number" name="driverId" class="field-control mono" th:value="${param.driverId}" required>
        </div>

        <div class="mb-3">
            <label class="field-label">Тип документ</label>
            <select name="type" class="field-control">
                <option value="DRIVING_LICENSE">Книжка</option>
                <option value="ID_CARD">Лична карта</option>
                <option value="DIGITAL_CARD">Дигитална карта</option>
                <option value="PROFESSIONAL_CERT">Професионална</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="field-label">Номер</label>
            <input type="text" name="number" class="field-control mono">
        </div>

        <div class="mb-4">
            <label class="field-label">Валиден до</label>
            <input type="date" name="expiryDate" class="field-control">
        </div>

        <button class="btn-route btn-block mb-2">💾 Запази документ</button>
        <a th:href="@{/driver}" class="btn-ghost btn-block">⬅ Назад към списъка</a>

    </form>

</div>

</body>
</html>

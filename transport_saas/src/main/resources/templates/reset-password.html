<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Нова парола - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body class="road-shell">

<div class="road-card">

    <div class="road-brand"><span class="dot"></span> Transport Manager</div>

    <div th:if="${!valid}">
        <h3 class="road-title" style="color: var(--signal-red);">Невалиден или изтекъл линк</h3>
        <p class="road-sub">Линкът за възстановяване вече не е валиден - заяви нов.</p>

        <a th:href="@{/forgot-password}" class="btn-route btn-block">
            Заяви нов линк
        </a>
    </div>

    <div th:if="${valid}">
        <h3 class="road-title">Нова парола</h3>
        <p class="road-sub">Задай новата си парола</p>

        <div th:if="${error}" class="notice notice-danger text-center mb-3" th:text="${error}"></div>

        <form th:action="@{/reset-password}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <input type="hidden" name="token" th:value="${token}">

            <div class="mb-3">
                <label class="field-label">Нова парола</label>
                <div class="password-wrap">
                    <input type="password" name="newPassword"
                           class="field-control" required minlength="6">
                    <button type="button" class="password-toggle" onclick="togglePassword(this)">👁</button>
                </div>
            </div>

            <div class="mb-4">
                <label class="field-label">Потвърди нова парола</label>
                <div class="password-wrap">
                    <input type="password" name="confirmPassword"
                           class="field-control" required minlength="6">
                    <button type="button" class="password-toggle" onclick="togglePassword(this)">👁</button>
                </div>
            </div>

            <button type="submit" class="btn-route btn-block">
                Смени паролата
            </button>

        </form>
    </div>

</div>

</body>
</html>

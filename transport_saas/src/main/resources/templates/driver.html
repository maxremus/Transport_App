<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Шофьори</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .layout {
            display: flex;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            background: #111827;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            color: #cbd5f5;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #1f2937;
            color: white;
        }

        .sidebar a.active {
            background: #22c55e;
            color: black;
        }

        .content {
            margin-left: 240px;
            width: 100%;
        }

        .card {
            border-radius: 16px;
        }

        .badge-status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .ok { background: #dcfce7; color: #166534; }
        .warning { background: #fef9c3; color: #854d0e; }
        .danger { background: #fee2e2; color: #991b1b; }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <h4>🚚 Transport</h4>

        <a th:href="@{/dashboard}">📊 Dashboard</a>
        <a th:href="@{/trips}">📦 Курсове</a>
        <a th:href="@{/vehicles}">🚛 МПС</a>

        <a th:href="@{/driver}"
           class="active">
            👨‍✈️ Шофьори
        </a>

        <hr>

        <a th:href="@{/upgrade}">💎 Абонамент</a>
        <a th:href="@{/settings}">⚙ Настройки</a>

        <hr>

        <a th:href="@{/logout}" class="text-danger">🚪 Изход</a>

    </div>

    <!-- CONTENT -->
    <div class="content">

        <div class="container-fluid py-4">

            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>👨‍✈️ Шофьори</h2>

                <a th:href="@{/driver-add}" class="btn btn-primary">
                    ➕ Добави шофьор
                </a>
            </div>

            <!-- TABLE -->
            <div class="card shadow-sm">

                <div class="card-body">

                    <h5 class="mb-3">Списък</h5>

                    <table class="table table-hover">

                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Име</th>
                            <th>Телефон</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="d : ${drivers}">
                            <td th:text="${d.id}"></td>
                            <td th:text="${d.name}"></td>
                            <td th:text="${d.phone}"></td>

                            <td>
                                <span class="badge-status ok">
                                    Активен
                                </span>
                            </td>

                            <td>
                                <a th:href="@{/driver-documents(driverId=${d.id})}"
                                   class="btn btn-sm btn-primary">
                                    📄 Документи
                                </a>
                            </td>
                        </tr>

                        </tbody>

                    </table>

                    <!-- ако няма данни -->
                    <div th:if="${drivers == null || drivers.isEmpty()}"
                         class="text-center text-muted mt-3">
                        Няма шофьори
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

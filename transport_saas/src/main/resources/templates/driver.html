<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{drivers.title} + ' - Transport Manager'">Шофьори - Transport Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('driver')}"></div>

    <div class="app-content">

        <div class="page-head">
            <div>
                <p class="page-eyebrow" th:text="#{drivers.eyebrow}">Екипаж</p>
                <h1 class="page-title" th:text="#{drivers.title}">Шофьори</h1>
            </div>

            <a th:href="@{/driver-add}" class="btn-route" th:text="#{drivers.add}">
                ➕ Добави шофьор
            </a>
        </div>

        <div class="panel">
            <div class="panel-body">

                <p class="panel-title" th:text="#{drivers.list}">Списък</p>

                <table class="manifest-table">

                    <thead>
                    <tr>
                        <th th:text="#{drivers.col.id}">ID</th>
                        <th th:text="#{drivers.col.name}">Име</th>
                        <th th:text="#{drivers.col.phone}">Телефон</th>
                        <th th:text="#{drivers.col.status}">Статус</th>
                        <th th:text="#{drivers.col.actions}">Действия</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="d : ${drivers}">
                        <td class="mono text-muted-c" th:text="${d.id}"></td>
                        <td th:text="${d.name}"></td>
                        <td class="mono" th:text="${d.phone}"></td>

                        <td>
                            <span class="pill pill-ok" th:text="#{drivers.status.active}">Активен</span>
                        </td>

                        <td class="d-flex gap-2">
                            <a th:href="@{/driver-documents(driverId=${d.id})}"
                               class="btn-ghost" style="padding:6px 14px; font-size:13px;" th:text="#{drivers.action.documents}">
                                📄 Документи
                            </a>
                            <a th:href="@{/driver-add(editId=${d.id})}"
                               class="btn-ghost" style="padding:6px 14px; font-size:13px;" th:text="#{drivers.action.edit}">
                                ✏ Редакция
                            </a>
                        </td>
                    </tr>

                    </tbody>

                </table>

                <div th:if="${drivers == null || drivers.isEmpty()}" class="empty-state" th:text="#{drivers.empty}">
                    Няма шофьори
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

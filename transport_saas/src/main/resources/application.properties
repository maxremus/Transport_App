spring.application.name=transport_saas

# SERVER
server.port=${PORT:8080}

# DATABASE (MySQL, e.g. Aiven / PlanetScale / Railway)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SSL
spring.datasource.hikari.data-source-properties.sslMode=REQUIRED
# По-малък pool - пести памет/нишки при 512MB Render инстанции
spring.datasource.hikari.maximum-pool-size=5

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway is on the classpath but no migrations exist -> disable it so it
# never tries to run/validate at startup (schema is managed by ddl-auto).
spring.flyway.enabled=false

# THYMELEAF
spring.thymeleaf.cache=false

# Собственият публичен адрес на тази услуга - използва се в линковете за
# възстановяване на парола в имейлите. Същият env var, който payment-service
# вече ползва, за да знае накъде да сочи (TRANSPORT_SAAS_PUBLIC_URL).
app.frontend-public-url=${TRANSPORT_SAAS_PUBLIC_URL:http://localhost:8080}

# ---------------------------------------------------------
# EMAIL (за забравена парола)
# Ако MAIL_USERNAME/MAIL_PASSWORD не са зададени, изпращането ще гръмне
# тихо и линкът за възстановяване ще се логне в конзолата като fallback,
# за да работи функцията дори без конфигуриран SMTP.
# За Gmail: MAIL_USERNAME=твоя_имейл@gmail.com, MAIL_PASSWORD=App Password
# (не обикновената парола - https://myaccount.google.com/apppasswords)
# ---------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ---------------------------------------------------------
# INTER-SERVICE COMMUNICATION (Feign clients)
# Set these to the internal Render URLs of the other services,
# e.g. http://driver-service:10000 (see render.yaml)
# ---------------------------------------------------------
driver.service.url=${DRIVER_SERVICE_URL:http://localhost:8081}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8082}

# Shared secret used to authenticate server-to-server calls coming from
# payment-service into /api/v1/company/** (must match payment-service's
# app.internal-key)
app.internal-key=${INTERNAL_API_KEY}

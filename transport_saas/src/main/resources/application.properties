spring.application.name=transport_saas

# SERVER
server.port=${PORT:8080}

# DATABASE (MySQL, e.g. Aiven / PlanetScale / Railway)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SSL
spring.datasource.hikari.data-source-properties.sslMode=REQUIRED

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway is on the classpath but no migrations exist -> disable it so it
# never tries to run/validate at startup (schema is managed by ddl-auto).
spring.flyway.enabled=false

# THYMELEAF
spring.thymeleaf.cache=false

# ---------------------------------------------------------
# INTER-SERVICE COMMUNICATION (Feign clients)
# Set these to the internal Render URLs of the other services,
# e.g. http://driver-service:10000 (see render.yaml)
# ---------------------------------------------------------
driver.service.url=${DRIVER_SERVICE_URL:http://localhost:8081}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8082}

# Shared secret used to authenticate server-to-server calls coming from
# payment-service into /api/v1/company/** (must match payment-service's
# app.internal-key)
app.internal-key=${INTERNAL_API_KEY}

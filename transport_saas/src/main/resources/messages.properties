error.contact=Ако проблемът се повтаря, пиши ни от страница „Помощ", като посочиш часа и кода по-горе.
error.status.400.title=Невалидна заявка
error.status.400.text=Изпратените данни не са в очаквания вид. Върни се назад, провери въведеното и опитай отново.
error.status.403.title=Нямаш достъп
error.status.403.text=Нямаш права да отвориш тази страница или да извършиш това действие.
error.status.404.title=Страницата не е намерена
error.status.404.text=Адресът не съществува или записът вече е изтрит. Провери линка или се върни в системата.
error.status.405.title=Действието не е позволено
error.status.405.text=Тази страница не приема такава заявка. Върни се назад и опитай по обичайния начин.
error.status.500.title=Възникна грешка в системата
error.status.500.text=Нещо се обърка от наша страна и действието не беше изпълнено. Данните ти не са загубени - опитай отново след малко.
error.status.generic.title=Възникна грешка
error.status.generic.text=Заявката не можа да бъде изпълнена. Опитай отново след малко.
error.cause.data=Данните влизат в конфликт със съществуващ запис (например повтарящ се номер или липсваща връзка). Провери въведеното.
error.cause.service=Свързаната услуга (шофьори или плащания) временно не отговаря. Опитай отново след малко.

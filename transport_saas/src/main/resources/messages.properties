support.guide.vehicles.text=Добавяй превозни средства с регистрационен номер и VIN. За всяко МПС можеш да качваш документи (ГТП, застраховка, винетка) с дата на валидност - системата те известява, преди да изтекат.
support.guide.clients.title=👤 Клиенти
support.guide.clients.text=Управлявай базата с клиенти на фирмата - данни за контакт и фактуриране, свързани автоматично с курсовете и фактурите им.
support.guide.invoices.title=🧾 Фактури
support.guide.invoices.text=Издавай фактури към клиенти на база завършени курсове, редактирай позиции и изтегляй готов PDF за изпращане.
support.guide.fuel.title=⛽ Гориво
support.guide.fuel.text=Записвай зареждания на гориво по МПС и следи разхода - справката помага да видиш реалната себестойност на всеки курс.
support.guide.drivers.title=🪪 Шофьори
support.guide.drivers.text=Добавяй шофьори с телефон за връзка и качвай документите им (книжка, лична карта, дигитална карта, професионална квалификация) с дата на валидност.
support.guide.subscription.title=💳 Абонамент
support.guide.subscription.text=Виж докога тече пробният ти период или платеният абонамент, и премини към PRO (25 €/мес) или PREMIUM (50 €/мес), когато си готов.
support.guide.settings.title=⚙️ Настройки
support.guide.settings.text=Смени паролата си, обнови данните на фирмата и включи известия по имейл за изтичащ абонамент и изтичащи документи.
support.contact.title=✉️ Пиши директно
support.contact.intro1=Можеш да пишеш директно на
support.contact.intro2=или да попълниш формата по-долу — съобщението ще стигне до нас автоматично, заедно с данните на твоята фирма.
support.field.subject=Тема
support.field.subject.placeholder=Например: Проблем с фактура
support.field.message=Съобщение
support.field.message.placeholder=Опиши какъв е проблемът или въпросът ти...
support.replyto=Ще отговорим на:
support.replyto.none=няма зададен имейл в профила ти
support.submit=📨 Изпрати


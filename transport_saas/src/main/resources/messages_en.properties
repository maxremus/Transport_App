# ---------- Help ----------
support.title=Help
support.eyebrow=Contact us
support.sent=✔ Message sent. We'll reply to the email provided as soon as possible.
support.guide.title=📖 How Transport Manager works
support.guide.dashboard.title=🏠 Dashboard
support.guide.dashboard.text=A company overview - active trips, revenue, upcoming expiring documents, and quick access to the essentials.
support.guide.trips.title=🚚 Trips
support.guide.trips.text=Log a new trip with start/end point, driver, vehicle and client. Track status (planned/in progress/completed) and revenue for each trip.
support.guide.vehicles.title=🚛 Vehicles
support.guide.vehicles.text=Add vehicles with plate number and VIN. Upload documents for each vehicle (inspection, insurance, vignette) with an expiry date - the system notifies you before they expire.
support.guide.clients.title=👤 Clients
support.guide.clients.text=Manage the company's client database - contact and billing details, automatically linked to their trips and invoices.
support.guide.invoices.title=🧾 Invoices
support.guide.invoices.text=Issue invoices to clients based on completed trips, edit line items, and download a ready-made PDF to send.
support.guide.fuel.title=⛽ Fuel
support.guide.fuel.text=Log fuel fill-ups per vehicle and track spending - the report helps you see the real cost of each trip.
support.guide.drivers.title=🪪 Drivers
support.guide.drivers.text=Add drivers with a contact phone and upload their documents (license, ID card, digital card, professional certificate) with an expiry date.
support.guide.subscription.title=💳 Subscription
support.guide.subscription.text=See how long your trial period or paid subscription has left, and switch to PRO (€25/mo) or PREMIUM (€50/mo) when you're ready.
support.guide.settings.title=⚙️ Settings
support.guide.settings.text=Change your password, update your company details, and turn on email notifications for expiring subscriptions and documents.
support.contact.title=✉️ Write to us directly
support.contact.intro1=You can email us directly at
support.contact.intro2=or fill in the form below — the message will reach us automatically, along with your company's details.
